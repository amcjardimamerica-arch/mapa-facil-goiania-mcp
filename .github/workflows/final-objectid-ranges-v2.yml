name: Final official export by fixed OBJECTID ranges v2

on:
  push:
    branches: [final-objectid-ranges-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export complete target cadastral data preserving composite record identity
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, collections
          from pathlib import Path

          OUT=Path('final_objectid_ranges_v2'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-FinalObjectIDRangesV2/1.0'}
          TARGET="nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%'"
          FIELDS='OBJECTID,ESRI_OID,nrinscr,tplogradou,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,dtgeo,dtultalter'
          MIN_OBJECTID=102
          MAX_OBJECTID=805307

          def post(params, tries=8, timeout=180):
              data=urllib.parse.urlencode(params).encode('utf-8'); last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(BASE+'/3/query',data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; print('retry',i+1,repr(e),flush=True); time.sleep(1.25*(i+1))
              raise RuntimeError(last)

          def record_key(a):
              return (int(a.get('OBJECTID')), int(a.get('ESRI_OID')), str(a.get('nrinscr') or '').strip())

          records={}; exact_repeat_rows=0; range_stats=[]
          def collect_range(lo,hi,depth=0):
              nonlocal_dummy=None
              global exact_repeat_rows
              where=f'({TARGET}) AND OBJECTID BETWEEN {lo} AND {hi}'
              obj=post({'where':where,'outFields':FIELDS,'returnGeometry':'false','resultRecordCount':'2000','f':'json'})
              fs=obj.get('features') or []
              if bool(obj.get('exceededTransferLimit')) or len(fs)>=2000:
                  if lo==hi: raise RuntimeError(f'Transfer limit unresolved for OBJECTID={lo}')
                  mid=(lo+hi)//2; collect_range(lo,mid,depth+1); collect_range(mid+1,hi,depth+1); return
              accepted=0
              for f in fs:
                  a=f.get('attributes') or {}
                  try: objid=int(a.get('OBJECTID')); esri=int(a.get('ESRI_OID'))
                  except: continue
                  if not (lo<=objid<=hi): raise RuntimeError(f'OBJECTID escaped range {lo}-{hi}: {objid}')
                  raw=(a.get('nmbairro') or '').strip()
                  if raw not in ('BRO JARDIM AMERICA','BRO NOVA SUICA'): raise RuntimeError(f'Bairro escaped target: {raw}')
                  k=(objid,esri,str(a.get('nrinscr') or '').strip())
                  prior=records.get(k)
                  if prior is not None:
                      if prior!=a: raise RuntimeError(f'Conflicting exact composite key {k}')
                      exact_repeat_rows+=1
                  else:
                      records[k]=a; accepted+=1
              range_stats.append({'lo':lo,'hi':hi,'depth':depth,'returned':len(fs),'accepted_new':accepted})

          WIDTH=10000
          for lo in range(MIN_OBJECTID,MAX_OBJECTID+1,WIDTH):
              hi=min(MAX_OBJECTID,lo+WIDTH-1); collect_range(lo,hi)
              print('through',hi,'unique composite records',len(records),'exact repeats',exact_repeat_rows,flush=True)
          if not records: raise RuntimeError('No target records collected')

          all_rows=list(records.values())
          raw_counts=collections.Counter((a.get('nmbairro') or '').strip() for a in all_rows)
          eligible=[a for a in all_rows if a.get('uso')==1 and a.get('propriedad')==1]

          def normid(s):
              s=''.join(str(s or '').strip().upper().split())
              return str(int(s)) if s.isdigit() else s
          def score(a):
              try: sub=int(a.get('insubprinc'))
              except: sub=10**9
              try: tt=int(a.get('ttsublot'))
              except: tt=10**9
              return (0 if sub==0 else 1,0 if tt==1 else 1,sub,int(a.get('OBJECTID') or 10**9),int(a.get('ESRI_OID') or 10**9),str(a.get('nrinscr') or ''))

          groups={}
          for a in eligible:
              key=((a.get('nmbairro') or '').strip(),normid(a.get('nrquadra')),normid(a.get('nrlote')))
              groups.setdefault(key,[]).append(a)
          selected=[]; duplicate_groups=[]; by_bairro=collections.Counter()
          for key,arr in groups.items():
              arr.sort(key=score); keep=arr[0]; selected.append(keep); by_bairro[key[0]]+=1
              if len(arr)>1:
                  duplicate_groups.append({
                      'bairro':key[0],'quadra':key[1],'lote':key[2],'count':len(arr),
                      'kept':{'OBJECTID':keep.get('OBJECTID'),'ESRI_OID':keep.get('ESRI_OID'),'nrinscr':keep.get('nrinscr'),'insubprinc':keep.get('insubprinc'),'ttsublot':keep.get('ttsublot')},
                      'discarded':[{'OBJECTID':x.get('OBJECTID'),'ESRI_OID':x.get('ESRI_OID'),'nrinscr':x.get('nrinscr'),'insubprinc':x.get('insubprinc'),'ttsublot':x.get('ttsublot')} for x in arr[1:]]
                  })
          print('all target',len(all_rows),'eligible registrations',len(eligible),'physical QL',len(selected),'by bairro',dict(by_bairro),flush=True)

          # Fetch selected official geometries by batches of official nrinscr. Returned rows are matched back to the full composite identity.
          def sqlquote(s): return "'"+str(s).replace("'","''")+"'"
          selected_by_key={record_key(a):a for a in selected}
          selected_keys=set(selected_by_key)
          by_inscr=collections.defaultdict(list)
          for k,a in selected_by_key.items():
              ins=str(a.get('nrinscr') or '').strip()
              if not ins: raise RuntimeError(f'Selected official record lacks nrinscr: {a}')
              by_inscr[ins].append(k)
          inscrs=sorted(by_inscr)

          geometry_by_key={}
          def fetch_inscr_batch(batch):
              batch=sorted(set(batch))
              if not batch:return
              if len(batch)>100:
                  for i in range(0,len(batch),100): fetch_inscr_batch(batch[i:i+100])
                  return
              clause='nrinscr IN ('+','.join(sqlquote(x) for x in batch)+')'
              where=f'({TARGET}) AND uso=1 AND propriedad=1 AND {clause}'
              try:
                  obj=post({'where':where,'outFields':FIELDS,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'},tries=5)
              except Exception:
                  if len(batch)<=4: raise
                  mid=len(batch)//2; fetch_inscr_batch(batch[:mid]); fetch_inscr_batch(batch[mid:]); return
              for f in obj.get('features',[]):
                  p=f.get('properties') or {}
                  try:k=(int(p.get('OBJECTID')),int(p.get('ESRI_OID')),str(p.get('nrinscr') or '').strip())
                  except:continue
                  if k in selected_keys and f.get('geometry') and (p.get('nmbairro') or '').strip() in ('BRO JARDIM AMERICA','BRO NOVA SUICA') and p.get('uso')==1 and p.get('propriedad')==1:
                      geometry_by_key[k]=f
              missing_ins=[]
              for ins in batch:
                  ks=by_inscr[ins]
                  if not any(k in geometry_by_key for k in ks): missing_ins.append(ins)
              if missing_ins:
                  if len(batch)<=4: raise RuntimeError(f'No matching official geometry for nrinscr {missing_ins}')
                  fetch_inscr_batch(missing_ins)

          for i in range(0,len(inscrs),200):
              fetch_inscr_batch(inscrs[i:i+200]); print('geometries',len(geometry_by_key),'/',len(selected_keys),flush=True)
          missing_keys=selected_keys-set(geometry_by_key)
          if missing_keys:
              # Resolve cases where duplicate nrinscr values exist by exact single-row conditions.
              for k in list(missing_keys):
                  a=selected_by_key[k]
                  where=f"({TARGET}) AND uso=1 AND propriedad=1 AND OBJECTID={int(a['OBJECTID'])} AND ESRI_OID={int(a['ESRI_OID'])} AND nrinscr={sqlquote(a['nrinscr'])}"
                  obj=post({'where':where,'outFields':FIELDS,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
                  for f in obj.get('features',[]):
                      p=f.get('properties') or {}
                      try:kk=(int(p.get('OBJECTID')),int(p.get('ESRI_OID')),str(p.get('nrinscr') or '').strip())
                      except:continue
                      if kk==k and f.get('geometry'): geometry_by_key[k]=f
              missing_keys=selected_keys-set(geometry_by_key)
          if missing_keys: raise RuntimeError(f'Missing exact official geometries: {list(missing_keys)[:20]} count={len(missing_keys)}')

          features=[geometry_by_key[record_key(a)] for a in selected]
          for f in features:
              p=f.get('properties') or {}
              if (p.get('nmbairro') or '').strip() not in ('BRO JARDIM AMERICA','BRO NOVA SUICA') or p.get('uso')!=1 or p.get('propriedad')!=1 or not f.get('geometry'):
                  raise RuntimeError(f'Ineligible final feature {p}')

          (OUT/'cadastro_residencial_particular_physical.geojson').write_text(json.dumps({'type':'FeatureCollection','features':features},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'all_target_attributes.json').write_text(json.dumps({'count':len(all_rows),'records':[{'attributes':a} for a in sorted(all_rows,key=score)]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'eligible_attributes.json').write_text(json.dumps({'count':len(eligible),'records':[{'attributes':a} for a in sorted(eligible,key=score)]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'duplicate_groups.json').write_text(json.dumps(duplicate_groups,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'range_stats.json').write_text(json.dumps(range_stats,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          manifest={
              'source':BASE+'/3','method':'fixed closed OBJECTID ranges; responses preserve composite identity OBJECTID+ESRI_OID+nrinscr; exact duplicate response rows removed only when byte-equivalent attributes; geometry queried by official nrinscr and matched to composite identity; no resultOffset/objectIds/returnIdsOnly selection',
              'objectid_min':MIN_OBJECTID,'objectid_max':MAX_OBJECTID,'base_range_width':WIDTH,'leaf_ranges':len(range_stats),'exact_duplicate_response_rows_removed':exact_repeat_rows,
              'all_target_records':len(all_rows),'all_target_counts_by_bairro':dict(raw_counts),'raw_eligible_records':len(eligible),
              'unique_bairro_quadra_lote':len(groups),'selected_records':len(selected),'counts_by_raw_bairro_unique_ql':dict(by_bairro),
              'duplicate_records_consolidated':len(eligible)-len(selected),'duplicate_ql_groups':len(duplicate_groups),
              'selection_rule':'one official record per bairro+quadra+lote; prefer insubprinc=0, then ttsublot=1, then lowest insubprinc, OBJECTID, ESRI_OID, nrinscr',
              'residential_semantic_mapping':'Verified current API: uso=1 is residential; uso1 is a separate secondary attribute.',
              'outSR':4326,'no_geometry_simplification':True,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          }
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-objectid-ranges-v2-official-export
          path: final_objectid_ranges_v2/
          if-no-files-found: error
