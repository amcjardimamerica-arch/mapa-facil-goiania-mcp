name: Cross-check target records by ESRI_OID enumeration

on:
  push:
    branches: [crosscheck-esri-enumeration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate ESRI_OID values independently
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,time,collections
          from pathlib import Path
          OUT=Path('crosscheck_esri');OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer/3/query'
          TARGET="nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%'"
          FIELDS='OBJECTID,ESRI_OID,nrinscr,tplogradou,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,dtgeo,dtultalter'
          def post(p,tries=7):
              data=urllib.parse.urlencode(p).encode();last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(BASE,data=data,headers={'User-Agent':'AMC-ESRIEnum/1.0','Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=180) as r:o=json.loads(r.read())
                      if isinstance(o,dict) and o.get('error'):raise RuntimeError(o['error'])
                      return o
                  except Exception as e:last=e;print('retry',i+1,repr(e),flush=True);time.sleep(1.2*(i+1))
              raise RuntimeError(last)
          rec={};repeats=0;chunks=0
          def key(a):return (int(a.get('OBJECTID')),int(a.get('ESRI_OID')),str(a.get('nrinscr') or '').strip())
          def fetch_ids(ids):
              global repeats,chunks
              ids=sorted(set(ids));
              if not ids:return
              clause='ESRI_OID IN ('+','.join(map(str,ids))+')'
              o=post({'where':f'({TARGET}) AND {clause}','outFields':FIELDS,'returnGeometry':'false','resultRecordCount':'2000','f':'json'})
              fs=o.get('features') or []
              if bool(o.get('exceededTransferLimit')) or len(fs)>=2000:
                  if len(ids)==1:raise RuntimeError(f'transfer limit for one ESRI_OID {ids[0]}')
                  m=len(ids)//2;fetch_ids(ids[:m]);fetch_ids(ids[m:]);return
              chunks+=1
              for f in fs:
                  a=f.get('attributes') or {}
                  try:k=key(a)
                  except:continue
                  if (a.get('nmbairro') or '').strip() not in ('BRO JARDIM AMERICA','BRO NOVA SUICA'):raise RuntimeError('escaped bairro')
                  if k in rec:
                      if rec[k]!=a:raise RuntimeError(f'conflicting composite key {k}')
                      repeats+=1
                  else:rec[k]=a
          # Observed maximum target OID is 12547; scan much wider to avoid relying on that observation as a completeness boundary.
          for start in range(0,30001,250):
              fetch_ids(range(start,min(30001,start+250)))
              if start%2500==0:print('enum through',start+249,'records',len(rec),flush=True)
          rows=list(rec.values()); raw=collections.Counter((a.get('nmbairro') or '').strip() for a in rows)
          eligible=[a for a in rows if a.get('uso')==1 and a.get('propriedad')==1]
          (OUT/'all_target_attributes_crosscheck.json').write_text(json.dumps({'count':len(rows),'records':[{'attributes':a} for a in rows]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          man={'method':'independent ESRI_OID enumeration 0..30000 using SQL IN; composite identity OBJECTID+ESRI_OID+nrinscr','all_target_records':len(rows),'counts_by_bairro':dict(raw),'eligible_records':len(eligible),'chunks':chunks,'exact_repeat_rows':repeats,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(man,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(man,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crosscheck-esri-enumeration
          path: crosscheck_esri/
          if-no-files-found: error
