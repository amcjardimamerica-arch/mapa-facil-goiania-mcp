name: Export compact official residential physical lots

on:
  push:
    branches: [final-compact]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export compact official geometries
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, re
          from pathlib import Path
          OUT=Path('final_compact'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-FinalCompact/1.0'}
          def post(params,tries=7,timeout=150):
              url=f'{BASE}/3/query'; data=urllib.parse.urlencode(params).encode(); last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(url,data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; print('retry',i+1,repr(e),flush=True); time.sleep(1.5*(i+1))
              raise RuntimeError(last)
          where="(nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%') AND uso=1 AND propriedad=1"
          ids=sorted(set(post({'where':where,'returnIdsOnly':'true','f':'json'}).get('objectIds') or []))
          attrs=[]; af='ESRI_OID,nrinscr,nrquadra,nrlote,nmbairro,insubprinc,ttsublot,areaterr,dtgeo,dtultalter'
          for i in range(0,len(ids),1500):
              obj=post({'objectIds':','.join(map(str,ids[i:i+1500])),'outFields':af,'returnGeometry':'false','f':'json'})
              attrs.extend([f['attributes'] for f in obj.get('features',[])])
              print('attrs',len(attrs),flush=True)
          def n(s):
              s=''.join(str(s or '').strip().upper().split())
              return str(int(s)) if s.isdigit() else s
          def sc(a):
              try: sub=int(a.get('insubprinc'))
              except: sub=10**9
              # no silent area synthesis; area is official. Prefer base code 0 where present, then stable lowest official sublot code.
              return (0 if sub==0 else 1,sub,int(a.get('ESRI_OID') or 10**9))
          groups={}
          for a in attrs:
              key=((a.get('nmbairro') or '').strip(),n(a.get('nrquadra')),n(a.get('nrlote')))
              groups.setdefault(key,[]).append(a)
          chosen=[]; dups=[]
          for key,arr in groups.items():
              arr.sort(key=sc); chosen.append(arr[0]['ESRI_OID'])
              if len(arr)>1: dups.append({'key':key,'count':len(arr),'kept_oid':arr[0]['ESRI_OID'],'kept_nrinscr':arr[0]['nrinscr']})
          chosen=sorted(set(chosen)); print('raw',len(ids),'uniqueQL',len(chosen),flush=True)
          fields='ESRI_OID,nrinscr,tplogradou,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,dtgeo,dtultalter'
          feats=[]
          for i in range(0,len(chosen),500):
              fc=post({'objectIds':','.join(map(str,chosen[i:i+500])),'outFields':fields,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
              got=fc.get('features') or []; feats.extend(got); print('geom',len(feats),'/',len(chosen),flush=True)
          if len(feats)!=len(chosen): raise RuntimeError(f'mismatch {len(feats)} {len(chosen)}')
          (OUT/'cadastro_residencial_particular_physical.geojson').write_text(json.dumps({'type':'FeatureCollection','features':feats},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          man={'source':BASE+'/3','where':where,'raw_eligible_records':len(ids),'unique_bairro_quadra_lote':len(groups),'selected_records':len(chosen),'duplicate_records_consolidated':len(ids)-len(chosen),'duplicate_ql_groups':len(dups),'selection_rule':'one official Cadastro Imobiliario record per bairro+quadra+lote; prefer insubprinc=0 when present, otherwise lowest official insubprinc, then OID','outSR':4326,'no_simplification':True,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(man,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'duplicate_groups.json').write_text(json.dumps(dups,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(man,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-compact-official-export
          path: final_compact/
          if-no-files-found: error
