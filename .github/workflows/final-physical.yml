name: Export one official residential cadastral geometry per physical QL

on:
  push:
    branches: [final-physical]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Select one cadastral record per neighborhood-quadra-lote then export geometry
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, re
          from pathlib import Path
          OUT=Path('final_physical'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-FinalPhysical/1.0'}
          def post(params,tries=8,timeout=180):
              url=f'{BASE}/3/query'; data=urllib.parse.urlencode(params).encode(); last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(url,data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; print('retry',i+1,repr(e),flush=True); time.sleep(2*(i+1))
              raise RuntimeError(last)
          where="(nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%') AND uso=1 AND propriedad=1"
          ids=sorted(set(post({'where':where,'returnIdsOnly':'true','f':'json'}).get('objectIds') or []))
          afields='ESRI_OID,nrinscr,nrquadra,nrlote,nmbairro,insubprinc,ttsublot,areaterr,propriedad,uso,uso1,nmlogradou,tplogradou,dtgeo,dtultalter'
          attrs=[]
          for i in range(0,len(ids),1000):
              obj=post({'objectIds':','.join(map(str,ids[i:i+1000])),'outFields':afields,'returnGeometry':'false','f':'json'})
              attrs.extend([f['attributes'] for f in obj.get('features',[])])
              print('attrs',i,len(attrs),flush=True)
          def n(s):
              s=' '.join(str(s or '').strip().split()).upper()
              if s.isdigit(): return str(int(s))
              return re.sub(r'\s+','',s)
          def score(a):
              try: sub=int(a.get('insubprinc'))
              except: sub=10**9
              is0=0 if sub==0 else 1
              try: dt=-int(re.sub(r'\D','',str(a.get('dtgeo') or a.get('dtultalter') or '')) or 0)
              except: dt=0
              return (is0,sub,dt,int(a.get('ESRI_OID') or 10**9))
          groups={}
          for a in attrs:
              key=((a.get('nmbairro') or '').strip(),n(a.get('nrquadra')),n(a.get('nrlote')))
              groups.setdefault(key,[]).append(a)
          chosen=[]; stats=[]
          for key,arr in groups.items():
              arr.sort(key=score); chosen.append(arr[0]['ESRI_OID'])
              if len(arr)>1: stats.append({'key':key,'count':len(arr),'kept':arr[0]['nrinscr'],'kept_oid':arr[0]['ESRI_OID'],'discarded':[x['nrinscr'] for x in arr[1:]]})
          chosen=sorted(set(chosen)); print('raw ids',len(ids),'physical ql selected',len(chosen),flush=True)
          fields=','.join(['ESRI_OID','nrinscr','instatus','inposfisc','inrecadast','cdlogradou','tplogradou','nmlogradou','nrimovel','incompl','nrquadra','nrlote','cdbairro','nmbairro','insubprinc','ttsublot','nrfrenter','areaterr','areatest','areaedif','areattedif','propriedad','situacao','topografia','nivel','solo','uso','uso1','uso2','formauso','localizac','nrgaragem','nratvecom','nrpaviment','ocupac_aux','in_valido','ci','nmedificio','id','id_qdr','x_coord','y_coord','dtinclusao','dtrecadast','dtultalter','dtgeo'])
          feats=[]
          for i in range(0,len(chosen),300):
              fc=post({'objectIds':','.join(map(str,chosen[i:i+300])),'outFields':fields,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
              feats.extend(fc.get('features') or []); print('geoms',i,len(feats),flush=True)
          if len(feats)!=len(chosen): raise RuntimeError(f'mismatch {len(chosen)} vs {len(feats)}')
          (OUT/'cadastro_residencial_particular_physical.geojson').write_text(json.dumps({'type':'FeatureCollection','features':feats},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          manifest={'source':BASE+'/3','where':where,'raw_eligible_records':len(ids),'unique_neighborhood_quadra_lote':len(groups),'selected_records':len(chosen),'duplicate_records_consolidated_before_geometry':len(ids)-len(chosen),'duplicate_ql_groups':len(stats),'selection_rule':'one record per bairro+quadra+lote; prefer insubprinc=0 when available, otherwise smallest insubprinc, then newest geometry/update, then OID','outSR':4326,'geometry_simplification':False,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'duplicate_groups.json').write_text(json.dumps(stats,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-physical-official-export
          path: final_physical/
          if-no-files-found: error
