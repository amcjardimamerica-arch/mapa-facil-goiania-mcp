name: Export final official residential lots using current API code

on:
  push:
    branches: [final-uso-residential]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export target official cadastral records
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from pathlib import Path
          OUT=Path('final_uso'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          USO='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Mapa_UsoDoSoloNew/MapServer'
          UA={'User-Agent':'AMC-FinalResidential/1.0'}
          def post(base,layer,params,tries=8,timeout=180):
              url=f'{base}/{layer}/query'; data=urllib.parse.urlencode(params).encode('utf-8'); last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(url,data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; print('retry',i+1,repr(e),flush=True); time.sleep(2*(i+1))
              raise RuntimeError(last)
          bairro_where="(nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%')"
          where=f"{bairro_where} AND uso = 1 AND propriedad = 1"
          ids=post(BASE,3,{'where':where,'returnIdsOnly':'true','f':'json'}).get('objectIds') or []
          ids=sorted(set(ids)); print('ids',len(ids),flush=True)
          fields=','.join(['ESRI_OID','nrinscr','instatus','inposfisc','inrecadast','cdlogradou','tplogradou','nmlogradou','nrimovel','incompl','nrquadra','nrlote','cdbairro','nmbairro','insubprinc','ttsublot','nrfrenter','areaterr','areatest','areaedif','areattedif','propriedad','situacao','topografia','nivel','solo','uso','uso1','uso2','formauso','localizac','nrgaragem','nratvecom','nrpaviment','ocupac_aux','in_valido','ci','nmedificio','id','id_qdr','x_coord','y_coord','dtinclusao','dtrecadast','dtultalter','dtgeo'])
          feats=[]; chunk=300
          for i in range(0,len(ids),chunk):
              fc=post(BASE,3,{'objectIds':','.join(map(str,ids[i:i+chunk])),'outFields':fields,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
              got=fc.get('features') or []; feats.extend(got); print('chunk',i,len(got),'total',len(feats),flush=True)
          if len(feats)!=len(ids): raise RuntimeError(f'count mismatch ids={len(ids)} features={len(feats)}')
          (OUT/'cadastro_residencial_particular.geojson').write_text(json.dumps({'type':'FeatureCollection','features':feats},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          counts={}
          for label,bw in [('Jardim América',"nmbairro LIKE 'BRO JARDIM AMERICA%'"),('Nova Suíça',"nmbairro LIKE 'BRO NOVA SUICA%'")]:
              counts[label]=post(BASE,3,{'where':f"({bw}) AND uso=1 AND propriedad=1",'returnCountOnly':'true','f':'json'}).get('count')
          layer4_count=post(USO,4,{'where':f"{bairro_where} AND uso=1",'returnCountOnly':'true','f':'json'}).get('count')
          manifest={'source_layer3':BASE+'/3','source_layer4_particular':USO+'/4','where':where,'meaning_verified_from_known_residential_lots':'current API stores residential code as uso=1; uso1 is predominantly 0 and is a different attribute','total_ids':len(ids),'counts_by_raw_bairro':counts,'layer4_particular_crosscheck_count_uso_1':layer4_count,'outSR':4326,'geometry_simplification':False,'maxAllowableOffset':None,'geometryPrecision':None,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-residential-official-export
          path: final_uso/
          if-no-files-found: error
