name: Export final official residential-private lots spatially

on:
  push:
    branches: [spatial-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export official data by official neighborhood polygons
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, unicodedata
          from pathlib import Path
          OUT=Path('spatial_final'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-SpatialFinal/1.0'}

          def post(layer, params, tries=7, timeout=180):
              url=f'{BASE}/{layer}/query'
              data=urllib.parse.urlencode(params).encode('utf-8')
              last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(url,data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: raw=r.read()
                      obj=json.loads(raw)
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; print('retry',layer,i+1,repr(e),flush=True); time.sleep(2*(i+1))
              raise RuntimeError(f'layer {layer} failed: {last}')

          def norm(s):
              if s is None: return ''
              s=unicodedata.normalize('NFD',str(s))
              s=''.join(c for c in s if unicodedata.category(c)!='Mn')
              return ' '.join(s.upper().split())

          # 1. All official neighborhood divisions in native SR 31982.
          bairros=post(2,{
              'where':'1=1','outFields':'OBJECTID,id,nm_bai,nm,nm1,nm2,nm3,ql_bai,x_coord,y_coord',
              'returnGeometry':'true','outSR':'31982','returnZ':'false','returnM':'false','f':'json'
          })
          selected=[]
          for f in bairros.get('features',[]):
              a=f.get('attributes') or {}
              vals=[a.get(k) for k in ('nm_bai','nm','nm1','nm2','nm3','ql_bai')]
              ns=[norm(x) for x in vals if x]
              is_ja=any('JARDIM' in x and 'AMERICA' in x for x in ns)
              is_ns=any('NOVA' in x and 'SUICA' in x for x in ns)
              if is_ja or is_ns:
                  f['_target']='Jardim América' if is_ja else 'Nova Suíça'
                  selected.append(f)
          if not selected:
              raise RuntimeError('No official target neighborhood polygons selected')
          targets=sorted(set(f['_target'] for f in selected))
          if targets != ['Jardim América','Nova Suíça']:
              raise RuntimeError(f'Expected both neighborhoods, found {targets}')
          print('selected neighborhoods',[(f['_target'],(f.get('attributes') or {}).get('nm_bai'),(f.get('attributes') or {}).get('OBJECTID')) for f in selected],flush=True)

          rings=[]
          for f in selected:
              rings.extend((f.get('geometry') or {}).get('rings') or [])
          geom31982=json.dumps({'rings':rings,'spatialReference':{'wkid':31982}},separators=(',',':'))

          # 2. Get only OIDs intersecting the official neighborhood polygons and satisfying requested criteria.
          filter_where='uso1 = 1 AND propriedad = 1'
          ids=post(3,{
              'where':filter_where,'geometry':geom31982,'geometryType':'esriGeometryPolygon','inSR':'31982',
              'spatialRel':'esriSpatialRelIntersects','returnIdsOnly':'true','f':'json'
          }).get('objectIds') or []
          ids=sorted(set(ids))
          print('candidate ids',len(ids),flush=True)

          fields=','.join([
              'ESRI_OID','nrinscr','instatus','inposfisc','inrecadast','cdlogradou','tplogradou','nmlogradou',
              'nrimovel','incompl','nrquadra','nrlote','cdbairro','nmbairro','insubprinc','ttsublot','nrfrenter',
              'areaterr','areatest','areaedif','areattedif','propriedad','situacao','topografia','nivel','solo',
              'uso','uso1','uso2','formauso','localizac','nrgaragem','nratvecom','nrpaviment','ocupac_aux',
              'in_valido','ci','nmedificio','id','id_qdr','x_coord','y_coord','dtinclusao','dtrecadast','dtultalter','dtgeo'
          ])
          features=[]
          chunk=150
          for i in range(0,len(ids),chunk):
              batch=ids[i:i+chunk]
              fc=post(3,{
                  'objectIds':','.join(map(str,batch)),'outFields':fields,'returnGeometry':'true','outSR':'4326',
                  'returnZ':'false','returnM':'false','f':'geojson'
              })
              got=fc.get('features') or []
              features.extend(got)
              print('features',i,len(got),len(features),flush=True)
          if len(features)!=len(ids):
              raise RuntimeError(f'Feature count mismatch ids={len(ids)} features={len(features)}')
          (OUT/'cadastro_residencial_particular_intersect.geojson').write_text(
              json.dumps({'type':'FeatureCollection','features':features},ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          # 3. Selected official neighborhood polygons reprojected by the same official server to WGS84.
          oids=[str((f.get('attributes') or {}).get('OBJECTID')) for f in selected]
          bai4326=post(2,{
              'objectIds':','.join(oids),'outFields':'OBJECTID,id,nm_bai,nm,nm1,nm2,nm3,ql_bai',
              'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'
          })
          (OUT/'bairros_oficiais.geojson').write_text(json.dumps(bai4326,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          # 4. Official public-area layer for local exclusion/audit check.
          pubids=post(4,{
              'where':'1=1','geometry':geom31982,'geometryType':'esriGeometryPolygon','inSR':'31982',
              'spatialRel':'esriSpatialRelIntersects','returnIdsOnly':'true','f':'json'
          }).get('objectIds') or []
          public=[]
          for i in range(0,len(pubids),150):
              fc=post(4,{
                  'objectIds':','.join(map(str,pubids[i:i+150])),'outFields':'*','returnGeometry':'true','outSR':'4326',
                  'returnZ':'false','returnM':'false','f':'geojson'
              })
              public.extend(fc.get('features') or [])
          (OUT/'areas_publicas_intersect.geojson').write_text(json.dumps({'type':'FeatureCollection','features':public},ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          manifest={
              'source':BASE,'layer_cadastro':3,'layer_bairros':2,'layer_areas_publicas':4,
              'filter_where':filter_where,'selection':'official neighborhood polygons + esriSpatialRelIntersects',
              'selected_neighborhood_features':[{'target':f['_target'],'attributes':f.get('attributes')} for f in selected],
              'candidate_ids':len(ids),'downloaded_features':len(features),'public_features_for_audit':len(public),
              'output_sr':4326,'geometry_simplification':False,'maxAllowableOffset':None,'geometryPrecision':None,
              'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          }
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-final-official-export
          path: spatial_final/
          if-no-files-found: error
