name: Final official export by adaptive spatial grid v2

on:
  push:
    branches: [final-spatial-grid-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export all target data with adaptive spatial cells
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, collections
          from pathlib import Path
          OUT=Path('final_spatial_grid_v2');OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-FinalSpatialGridV2/1.0'}
          FIELDS='ESRI_OID,OBJECTID,nrinscr,tplogradou,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,dtgeo,dtultalter'
          def post(layer,p,tries=7):
              data=urllib.parse.urlencode(p).encode();last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(f'{BASE}/{layer}/query',data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=180) as r:o=json.loads(r.read())
                      if isinstance(o,dict) and o.get('error'):raise RuntimeError(o['error'])
                      return o
                  except Exception as e:last=e;print('retry',layer,i+1,repr(e),flush=True);time.sleep(1.2*(i+1))
              raise RuntimeError(last)
          bfc=post(2,{'where':'OBJECTID=770 OR OBJECTID=1075','outFields':'OBJECTID,nm_bai,nm,nm1,nm2,nm3,ql_bai','returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
          targets={}
          for f in bfc.get('features',[]):
              p=f.get('properties') or {}; oid=int(p.get('OBJECTID'))
              raw='BRO JARDIM AMERICA' if oid==770 else ('BRO NOVA SUICA' if oid==1075 else None)
              if not raw:continue
              xs=[];ys=[]
              def walk(x):
                  if isinstance(x,(list,tuple)) and len(x)>=2 and isinstance(x[0],(int,float)) and isinstance(x[1],(int,float)):xs.append(float(x[0]));ys.append(float(x[1]));return
                  if isinstance(x,(list,tuple)):
                      for z in x:walk(z)
              walk((f.get('geometry') or {}).get('coordinates'))
              targets[raw]=(min(xs),min(ys),max(xs),max(ys))
          if set(targets)!={'BRO JARDIM AMERICA','BRO NOVA SUICA'}:raise RuntimeError('target bairros unresolved')
          (OUT/'bairros_oficiais.geojson').write_text(json.dumps(bfc,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          def envj(e):
              a,b,c,d=e;return json.dumps({'xmin':a,'ymin':b,'xmax':c,'ymax':d,'spatialReference':{'wkid':4326}},separators=(',',':'))
          def split(e):
              a,b,c,d=e;xm=(a+c)/2;ym=(b+d)/2;return [(a,b,xm,ym),(xm,b,c,ym),(a,ym,xm,d),(xm,ym,c,d)]
          attrs={};leaf=0
          def collect(raw,e,depth=0):
              global leaf
              where=f"nmbairro LIKE '{raw}%'"
              o=post(3,{'where':where,'geometry':envj(e),'geometryType':'esriGeometryEnvelope','inSR':'4326','spatialRel':'esriSpatialRelIntersects','outFields':FIELDS,'returnGeometry':'false','resultRecordCount':'1000','f':'json'})
              fs=o.get('features') or [];limited=bool(o.get('exceededTransferLimit')) or len(fs)>=1000
              if limited:
                  if depth>=12:raise RuntimeError(f'unresolved transfer limit {raw} {e}')
                  for q in split(e):collect(raw,q,depth+1)
                  return
              leaf+=1
              for f in fs:
                  a=f.get('attributes') or {}
                  try:oid=int(a.get('ESRI_OID'))
                  except:continue
                  if (a.get('nmbairro') or '').strip()==raw:attrs[oid]=a
          for raw,bbox in targets.items():
              a,b,c,d=bbox
              for ix in range(4):
                  for iy in range(4):
                      collect(raw,(a+(c-a)*ix/4,b+(d-b)*iy/4,a+(c-a)*(ix+1)/4,b+(d-b)*(iy+1)/4))
              print('attrs after',raw,len(attrs),flush=True)
          eligible={oid:a for oid,a in attrs.items() if a.get('uso')==1 and a.get('propriedad')==1}
          def nid(s):
              s=''.join(str(s or '').strip().upper().split());return str(int(s)) if s.isdigit() else s
          def score(a):
              try:sub=int(a.get('insubprinc'))
              except:sub=10**9
              try:tt=int(a.get('ttsublot'))
              except:tt=10**9
              return (0 if sub==0 else 1,0 if tt==1 else 1,sub,int(a['ESRI_OID']))
          groups={}
          for oid,a in eligible.items():groups.setdefault(((a.get('nmbairro') or '').strip(),nid(a.get('nrquadra')),nid(a.get('nrlote'))),[]).append(a)
          chosen=[];dups=[];byb=collections.Counter()
          for k,arr in groups.items():
              arr.sort(key=score);z=arr[0];chosen.append(int(z['ESRI_OID']));byb[k[0]]+=1
              if len(arr)>1:dups.append({'bairro':k[0],'quadra':k[1],'lote':k[2],'count':len(arr),'kept_oid':z['ESRI_OID'],'kept_nrinscr':z.get('nrinscr'),'kept_insubprinc':z.get('insubprinc'),'kept_ttsublot':z.get('ttsublot'),'other_oids':[int(x['ESRI_OID']) for x in arr[1:]]})
          chosen=sorted(set(chosen));print('eligible',len(eligible),'physical',len(chosen),dict(byb),flush=True)
          def geos(ids):
              ids=sorted(set(ids));out={}
              if not ids:return out
              if len(ids)>150:
                  for i in range(0,len(ids),150):out.update(geos(ids[i:i+150]))
                  return out
              bb=collections.defaultdict(list)
              for oid in ids:bb[(eligible[oid].get('nmbairro') or '').strip()].append(oid)
              for raw,ii in bb.items():
                  clause='ESRI_OID IN ('+','.join(map(str,ii))+')';w=f"nmbairro LIKE '{raw}%' AND uso=1 AND propriedad=1 AND {clause}"
                  try:o=post(3,{'where':w,'outFields':FIELDS,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'},tries=5)
                  except Exception:
                      if len(ii)<=6:raise
                      m=len(ii)//2;out.update(geos(ii[:m]));out.update(geos(ii[m:]));continue
                  got={}
                  for f in o.get('features',[]):
                      p=f.get('properties') or {}
                      try:oid=int(p.get('ESRI_OID'))
                      except:continue
                      if oid in ii and (p.get('nmbairro') or '').strip()==raw and p.get('uso')==1 and p.get('propriedad')==1 and f.get('geometry'):got[oid]=f
                  miss=sorted(set(ii)-set(got))
                  if miss:
                      if len(ii)<=6:raise RuntimeError(f'missing geometry {miss}')
                      got.update(geos(miss))
                  out.update(got)
              return out
          gm={}
          for i in range(0,len(chosen),300):gm.update(geos(chosen[i:i+300]));print('geoms',len(gm),'/',len(chosen),flush=True)
          if set(gm)!=set(chosen):raise RuntimeError('geometry mismatch')
          gc={raw:int(post(3,{'where':f"nmbairro LIKE '{raw}%'",'returnCountOnly':'true','f':'json'}).get('count') or 0) for raw in targets}
          sc=collections.Counter((a.get('nmbairro') or '').strip() for a in attrs.values())
          (OUT/'cadastro_residencial_particular_physical.geojson').write_text(json.dumps({'type':'FeatureCollection','features':[gm[x] for x in chosen]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'all_target_attributes.json').write_text(json.dumps({'count':len(attrs),'records':[{'attributes':attrs[x]} for x in sorted(attrs)]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'eligible_attributes.json').write_text(json.dumps({'count':len(eligible),'records':[{'attributes':eligible[x]} for x in sorted(eligible)]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'duplicate_groups.json').write_text(json.dumps(dups,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          man={'source':BASE+'/3','bairro_source':BASE+'/2','method':'adaptive official spatial grid using exceededTransferLimit; data selected without resultOffset/objectIds/returnIdsOnly','global_raw_bairro_counts_diagnostic':gc,'spatial_unique_all_target_records':len(attrs),'spatial_counts_by_bairro':dict(sc),'raw_eligible_records':len(eligible),'unique_bairro_quadra_lote':len(groups),'selected_records':len(chosen),'counts_by_raw_bairro_unique_ql':dict(byb),'duplicate_records_consolidated':len(eligible)-len(chosen),'duplicate_ql_groups':len(dups),'selection_rule':'one official record per bairro+quadra+lote; prefer insubprinc=0, then ttsublot=1, then lowest insubprinc, then ESRI_OID','outSR':4326,'no_geometry_simplification':True,'leaf_cells':leaf,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(man,ensure_ascii=False,indent=2),encoding='utf-8');print(json.dumps(man,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-spatial-grid-v2-official-export
          path: final_spatial_grid_v2/
          if-no-files-found: error
