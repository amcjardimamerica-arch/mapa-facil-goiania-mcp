name: Final official export by fixed OBJECTID ranges

on:
  push:
    branches: [final-objectid-ranges]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export complete target cadastral data using bounded OBJECTID ranges
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, collections
          from pathlib import Path

          OUT=Path('final_objectid_ranges'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-FinalObjectIDRanges/1.0'}
          TARGET="nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%'"
          FIELDS='OBJECTID,ESRI_OID,nrinscr,tplogradou,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,dtgeo,dtultalter'
          MIN_OBJECTID=102
          MAX_OBJECTID=805307

          def post(params, tries=8, timeout=180):
              data=urllib.parse.urlencode(params).encode('utf-8'); last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(BASE+'/3/query',data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; print('retry',i+1,repr(e),flush=True); time.sleep(1.25*(i+1))
              raise RuntimeError(last)

          # Use only closed OBJECTID ranges. No resultOffset/objectIds/returnIdsOnly.
          # ESRI_OID is the true unique OID and is used to deduplicate records crossing no range boundaries.
          records={}; range_stats=[]; collisions=[]
          def collect_range(lo,hi,depth=0):
              if lo>hi: return
              where=f'({TARGET}) AND OBJECTID BETWEEN {lo} AND {hi}'
              obj=post({'where':where,'outFields':FIELDS,'returnGeometry':'false','resultRecordCount':'2000','f':'json'})
              fs=obj.get('features') or []
              limited=bool(obj.get('exceededTransferLimit')) or len(fs)>=2000
              if limited:
                  if lo==hi: raise RuntimeError(f'Transfer limit unresolved for single OBJECTID {lo}')
                  mid=(lo+hi)//2
                  collect_range(lo,mid,depth+1); collect_range(mid+1,hi,depth+1); return
              local=0
              for f in fs:
                  a=f.get('attributes') or {}
                  try: esri=int(a.get('ESRI_OID')); objid=int(a.get('OBJECTID'))
                  except: continue
                  if not (lo<=objid<=hi): raise RuntimeError(f'OBJECTID escaped range {lo}-{hi}: {objid}')
                  raw=(a.get('nmbairro') or '').strip()
                  if raw not in ('BRO JARDIM AMERICA','BRO NOVA SUICA'): raise RuntimeError(f'Bairro escaped target: {raw}')
                  prior=records.get(esri)
                  if prior is not None and prior != a:
                      collisions.append({'ESRI_OID':esri,'first':prior,'second':a})
                      raise RuntimeError(f'Conflicting duplicate ESRI_OID {esri}')
                  records[esri]=a; local+=1
              range_stats.append({'lo':lo,'hi':hi,'depth':depth,'returned':len(fs),'accepted':local,'limited':False})

          WIDTH=10000
          for lo in range(MIN_OBJECTID,MAX_OBJECTID+1,WIDTH):
              hi=min(MAX_OBJECTID,lo+WIDTH-1)
              collect_range(lo,hi)
              print('ranges through',hi,'unique records',len(records),flush=True)
          if not records: raise RuntimeError('No target records collected')

          # Cross-check endpoints and exact raw-bairro membership independently.
          raw_counts=collections.Counter((a.get('nmbairro') or '').strip() for a in records.values())
          if set(raw_counts)-{'BRO JARDIM AMERICA','BRO NOVA SUICA'}: raise RuntimeError(f'Unexpected bairros {raw_counts}')

          # The current API stores the UI residential code in uso=1. uso1 is a distinct secondary field.
          eligible={esri:a for esri,a in records.items() if a.get('uso')==1 and a.get('propriedad')==1}
          def normid(s):
              s=''.join(str(s or '').strip().upper().split())
              return str(int(s)) if s.isdigit() else s
          def score(a):
              try: sub=int(a.get('insubprinc'))
              except: sub=10**9
              try: tt=int(a.get('ttsublot'))
              except: tt=10**9
              return (0 if sub==0 else 1, 0 if tt==1 else 1, sub, int(a.get('ESRI_OID') or 10**9))

          groups={}
          for esri,a in eligible.items():
              key=((a.get('nmbairro') or '').strip(),normid(a.get('nrquadra')),normid(a.get('nrlote')))
              groups.setdefault(key,[]).append(a)
          chosen=[]; duplicate_groups=[]; by_bairro=collections.Counter()
          for key,arr in groups.items():
              arr.sort(key=score); keep=arr[0]; chosen.append(int(keep['ESRI_OID'])); by_bairro[key[0]]+=1
              if len(arr)>1:
                  duplicate_groups.append({
                      'bairro':key[0],'quadra':key[1],'lote':key[2],'count':len(arr),
                      'kept_esri_oid':int(keep['ESRI_OID']),'kept_objectid':keep.get('OBJECTID'),'kept_nrinscr':keep.get('nrinscr'),
                      'kept_insubprinc':keep.get('insubprinc'),'kept_ttsublot':keep.get('ttsublot'),
                      'other_esri_oids':[int(x['ESRI_OID']) for x in arr[1:]]
                  })
          chosen=sorted(set(chosen))
          print('all target',len(records),'eligible registrations',len(eligible),'physical QL',len(chosen),'by bairro',dict(by_bairro),flush=True)

          # Fetch exact official geometry using SQL ESRI_OID IN, which was independently verified to map to the true OID.
          def fetch_geo(ids):
              ids=sorted(set(int(x) for x in ids)); out={}
              if not ids: return out
              if len(ids)>140:
                  for i in range(0,len(ids),140): out.update(fetch_geo(ids[i:i+140]))
                  return out
              byb=collections.defaultdict(list)
              for esri in ids: byb[(eligible[esri].get('nmbairro') or '').strip()].append(esri)
              for raw,ii in byb.items():
                  clause='ESRI_OID IN ('+','.join(map(str,ii))+')'
                  where=f"nmbairro LIKE '{raw}%' AND uso=1 AND propriedad=1 AND {clause}"
                  try:
                      obj=post({'where':where,'outFields':FIELDS,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'},tries=5)
                  except Exception:
                      if len(ii)<=5: raise
                      mid=len(ii)//2; out.update(fetch_geo(ii[:mid])); out.update(fetch_geo(ii[mid:])); continue
                  got={}
                  for f in obj.get('features',[]):
                      p=f.get('properties') or {}
                      try: esri=int(p.get('ESRI_OID'))
                      except: continue
                      if esri in ii and (p.get('nmbairro') or '').strip()==raw and p.get('uso')==1 and p.get('propriedad')==1 and f.get('geometry'):
                          got[esri]=f
                  miss=sorted(set(ii)-set(got))
                  if miss:
                      if len(ii)<=5: raise RuntimeError(f'Missing official geometry ESRI_OID={miss} bairro={raw}')
                      got.update(fetch_geo(miss))
                  out.update(got)
              return out

          gmap={}
          for i in range(0,len(chosen),280):
              gmap.update(fetch_geo(chosen[i:i+280])); print('geometry',len(gmap),'/',len(chosen),flush=True)
          if set(gmap)!=set(chosen): raise RuntimeError(f'Geometry OID mismatch got={len(gmap)} want={len(chosen)}')
          features=[gmap[x] for x in chosen]
          for f in features:
              p=f.get('properties') or {}
              if (p.get('nmbairro') or '').strip() not in ('BRO JARDIM AMERICA','BRO NOVA SUICA') or p.get('uso')!=1 or p.get('propriedad')!=1 or not f.get('geometry'):
                  raise RuntimeError(f'Ineligible final feature: {p}')

          # Diagnostic counts only; never used to select records.
          diagnostics={}
          for raw in ('BRO JARDIM AMERICA','BRO NOVA SUICA'):
              diagnostics[raw]=post({'where':f"nmbairro LIKE '{raw}%'",'returnCountOnly':'true','f':'json'}).get('count')

          (OUT/'cadastro_residencial_particular_physical.geojson').write_text(json.dumps({'type':'FeatureCollection','features':features},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'all_target_attributes.json').write_text(json.dumps({'count':len(records),'records':[{'attributes':records[x]} for x in sorted(records)]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'eligible_attributes.json').write_text(json.dumps({'count':len(eligible),'records':[{'attributes':eligible[x]} for x in sorted(eligible)]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'duplicate_groups.json').write_text(json.dumps(duplicate_groups,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'range_stats.json').write_text(json.dumps(range_stats,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          manifest={
              'source':BASE+'/3','method':'fixed closed OBJECTID ranges BETWEEN lo AND hi; transfer-limit ranges recursively subdivided; rows deduplicated by true OID ESRI_OID; geometry by SQL ESRI_OID IN; no resultOffset, no objectIds parameter, no returnIdsOnly for selection',
              'objectid_min':MIN_OBJECTID,'objectid_max':MAX_OBJECTID,'base_range_width':WIDTH,'leaf_ranges':len(range_stats),
              'all_target_records':len(records),'all_target_counts_by_bairro':dict(raw_counts),'diagnostic_returnCountOnly':diagnostics,
              'raw_eligible_records':len(eligible),'unique_bairro_quadra_lote':len(groups),'selected_records':len(chosen),'counts_by_raw_bairro_unique_ql':dict(by_bairro),
              'duplicate_records_consolidated':len(eligible)-len(chosen),'duplicate_ql_groups':len(duplicate_groups),
              'selection_rule':'one official Cadastro Imobiliario record per bairro+quadra+lote; prefer insubprinc=0, then ttsublot=1, then lowest insubprinc, then ESRI_OID',
              'residential_semantic_mapping':'Current API verified against known residential lots: uso=1 is residential; uso1 is a separate secondary attribute.',
              'outSR':4326,'no_geometry_simplification':True,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          }
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-objectid-ranges-official-export
          path: final_objectid_ranges/
          if-no-files-found: error
