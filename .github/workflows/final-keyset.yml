name: Final official export by ESRI_OID keyset

on:
  push:
    branches: [final-keyset]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export exact residential-private records by keyset
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, collections
          from pathlib import Path
          OUT=Path('final_keyset'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          TARGET="(nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%') AND uso=1 AND propriedad=1"
          UA={'User-Agent':'AMC-FinalKeyset/1.0'}
          def post(params, tries=8):
              data=urllib.parse.urlencode(params).encode(); last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(BASE+'/3/query',data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=180) as r:o=json.loads(r.read())
                      if isinstance(o,dict) and o.get('error'): raise RuntimeError(o['error'])
                      return o
                  except Exception as e:
                      last=e; print('retry',i+1,repr(e),flush=True); time.sleep(1.5*(i+1))
              raise RuntimeError(last)
          fields='ESRI_OID,OBJECTID,nrinscr,tplogradou,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,dtgeo,dtultalter'
          # Keyset pagination: never uses resultOffset/objectIds/returnIdsOnly.
          amap={}; last=-1; pages=0
          while True:
              where=f'({TARGET}) AND ESRI_OID > {last}'
              obj=post({'where':where,'outFields':fields,'returnGeometry':'false','orderByFields':'ESRI_OID ASC','resultRecordCount':750,'f':'json'})
              fs=obj.get('features') or []
              if not fs: break
              oids=[]
              for f in fs:
                  a=f.get('attributes') or {}; oid=int(a['ESRI_OID']); oids.append(oid)
                  if oid<=last: raise RuntimeError(f'non-increasing OID {oid} <= {last}')
                  if (a.get('nmbairro') or '').strip() not in ('BRO JARDIM AMERICA','BRO NOVA SUICA') or a.get('uso')!=1 or a.get('propriedad')!=1:
                      raise RuntimeError(f'ineligible attribute row {a}')
                  amap[oid]=a
              if oids != sorted(oids) or len(oids)!=len(set(oids)): raise RuntimeError('page OIDs not unique/sorted')
              last=max(oids); pages+=1; print('attrs page',pages,'got',len(fs),'total',len(amap),'last',last,flush=True)
              if len(fs)<750:
                  # Verify there is genuinely nothing after last.
                  chk=post({'where':f'({TARGET}) AND ESRI_OID > {last}','returnCountOnly':'true','f':'json'}).get('count',0)
                  if chk==0: break
          if not amap: raise RuntimeError('No eligible records returned')
          ids=sorted(amap)
          # Independent count is informational only; keyset payload is authoritative.
          count_check=post({'where':TARGET,'returnCountOnly':'true','f':'json'}).get('count')
          print('keyset records',len(ids),'count_check',count_check,flush=True)

          def normid(s):
              s=''.join(str(s or '').strip().upper().split())
              return str(int(s)) if s.isdigit() else s
          def score(a):
              try: sub=int(a.get('insubprinc'))
              except: sub=10**9
              try: tt=int(a.get('ttsublot'))
              except: tt=10**9
              return (0 if sub==0 else 1,0 if tt==1 else 1,sub,int(a['ESRI_OID']))
          groups={}
          for oid,a in amap.items():
              key=((a.get('nmbairro') or '').strip(),normid(a.get('nrquadra')),normid(a.get('nrlote')))
              groups.setdefault(key,[]).append(a)
          chosen=[]; dups=[]; by_bairro=collections.Counter()
          for key,arr in groups.items():
              arr.sort(key=score); keep=arr[0]; chosen.append(int(keep['ESRI_OID'])); by_bairro[key[0]]+=1
              if len(arr)>1:
                  dups.append({'bairro':key[0],'quadra':key[1],'lote':key[2],'count':len(arr),'kept_oid':keep['ESRI_OID'],'kept_nrinscr':keep.get('nrinscr'),'kept_insubprinc':keep.get('insubprinc'),'kept_ttsublot':keep.get('ttsublot'),'other_oids':[int(x['ESRI_OID']) for x in arr[1:]]})
          chosen=sorted(set(chosen)); print('unique physical QL',len(chosen),dict(by_bairro),flush=True)

          def fetch_geo(wanted):
              wanted=sorted(set(wanted))
              if not wanted:return {}
              if len(wanted)>250:
                  z={}
                  for i in range(0,len(wanted),250): z.update(fetch_geo(wanted[i:i+250]))
                  return z
              clause='ESRI_OID IN ('+','.join(map(str,wanted))+')'
              try:
                  o=post({'where':f'({TARGET}) AND {clause}','outFields':fields,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'},tries=5)
              except Exception:
                  if len(wanted)<=10: raise
                  m=len(wanted)//2; z=fetch_geo(wanted[:m]); z.update(fetch_geo(wanted[m:])); return z
              W=set(wanted); g={}
              for f in o.get('features',[]):
                  p=f.get('properties') or {}
                  try: oid=int(p.get('ESRI_OID'))
                  except: continue
                  if oid in W and (p.get('nmbairro') or '').strip() in ('BRO JARDIM AMERICA','BRO NOVA SUICA') and p.get('uso')==1 and p.get('propriedad')==1 and f.get('geometry'):
                      g[oid]=f
              missing=sorted(W-set(g))
              if missing:
                  if len(wanted)<=10: raise RuntimeError(f'missing geometry {missing}')
                  g.update(fetch_geo(missing))
              return g
          gmap={}
          for i in range(0,len(chosen),500):
              gmap.update(fetch_geo(chosen[i:i+500])); print('geometry',len(gmap),'/',len(chosen),flush=True)
          if set(gmap)!=set(chosen): raise RuntimeError(f'geometry set mismatch {len(gmap)} != {len(chosen)}')
          features=[gmap[x] for x in chosen]
          (OUT/'cadastro_residencial_particular_physical.geojson').write_text(json.dumps({'type':'FeatureCollection','features':features},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'eligible_attributes.json').write_text(json.dumps({'count':len(ids),'records':[{'attributes':amap[x]} for x in ids]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'duplicate_groups.json').write_text(json.dumps(dups,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          manifest={'source':BASE+'/3','where':TARGET,'query_method':'keyset pagination WHERE ESRI_OID > last_id ORDER BY ESRI_OID; no resultOffset, no objectIds, no returnIdsOnly','attribute_pages':pages,'raw_eligible_records':len(ids),'independent_count_check':count_check,'unique_bairro_quadra_lote':len(groups),'selected_records':len(chosen),'counts_by_raw_bairro_unique_ql':dict(by_bairro),'duplicate_records_consolidated':len(ids)-len(chosen),'duplicate_ql_groups':len(dups),'selection_rule':'one official record per bairro+quadra+lote; prefer insubprinc=0, then ttsublot=1, then lowest insubprinc, then ESRI_OID','outSR':4326,'no_geometry_simplification':True,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-keyset-official-export
          path: final_keyset/
          if-no-files-found: error
