name: Export official lots through neighborhood envelope

on:
  push:
    branches: [spatial-envelope]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export by official neighborhood envelope
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, unicodedata, math
          from pathlib import Path
          OUT=Path('spatial_envelope'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-SpatialEnvelope/1.0'}
          def post(layer, params, tries=7, timeout=180):
              url=f'{BASE}/{layer}/query'; data=urllib.parse.urlencode(params).encode('utf-8'); last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(url,data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; print('retry',layer,i+1,repr(e),flush=True); time.sleep(2*(i+1))
              raise RuntimeError(f'layer {layer} failed: {last}')
          def norm(s):
              if s is None:return ''
              s=unicodedata.normalize('NFD',str(s)); s=''.join(c for c in s if unicodedata.category(c)!='Mn')
              return ' '.join(s.upper().split())

          bairros=post(2,{'where':'1=1','outFields':'OBJECTID,id,nm_bai,nm,nm1,nm2,nm3,ql_bai,x_coord,y_coord','returnGeometry':'true','outSR':'31982','returnZ':'false','returnM':'false','f':'json'})
          selected=[]
          for f in bairros.get('features',[]):
              a=f.get('attributes') or {}; vals=[a.get(k) for k in ('nm_bai','nm','nm1','nm2','nm3','ql_bai')]
              ns=[norm(v) for v in vals if v]
              ja=any('JARDIM' in x and 'AMERICA' in x for x in ns); nsu=any('NOVA' in x and 'SUICA' in x for x in ns)
              if ja or nsu:
                  f['_target']='Jardim América' if ja else 'Nova Suíça'; selected.append(f)
          if sorted(set(f['_target'] for f in selected)) != ['Jardim América','Nova Suíça']:
              raise RuntimeError('Could not identify both official neighborhoods')
          xs=[]; ys=[]
          for f in selected:
              for ring in (f.get('geometry') or {}).get('rings',[]):
                  for x,y,*_ in ring: xs.append(x); ys.append(y)
          env={'xmin':min(xs)-5,'ymin':min(ys)-5,'xmax':max(xs)+5,'ymax':max(ys)+5,'spatialReference':{'wkid':31982}}
          envj=json.dumps(env,separators=(',',':'))
          print('envelope',env,flush=True)

          fields=','.join(['ESRI_OID','nrinscr','instatus','inposfisc','inrecadast','cdlogradou','tplogradou','nmlogradou','nrimovel','incompl','nrquadra','nrlote','cdbairro','nmbairro','insubprinc','ttsublot','nrfrenter','areaterr','areatest','areaedif','areattedif','propriedad','situacao','topografia','nivel','solo','uso','uso1','uso2','formauso','localizac','nrgaragem','nratvecom','nrpaviment','ocupac_aux','in_valido','ci','nmedificio','id','id_qdr','x_coord','y_coord','dtinclusao','dtrecadast','dtultalter','dtgeo'])
          where='uso1 = 1 AND propriedad = 1'
          ids=post(3,{'where':where,'geometry':envj,'geometryType':'esriGeometryEnvelope','inSR':'31982','spatialRel':'esriSpatialRelIntersects','returnIdsOnly':'true','f':'json'}).get('objectIds') or []
          ids=sorted(set(ids)); print('cadastro candidate ids',len(ids),flush=True)
          feats=[]
          for i in range(0,len(ids),150):
              fc=post(3,{'objectIds':','.join(map(str,ids[i:i+150])),'outFields':fields,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
              got=fc.get('features') or []; feats.extend(got); print('cadastro',i,len(got),len(feats),flush=True)
          if len(feats)!=len(ids): raise RuntimeError(f'count mismatch {len(ids)} ids vs {len(feats)} features')
          (OUT/'cadastro_candidates.geojson').write_text(json.dumps({'type':'FeatureCollection','features':feats},ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          oids=[str((f.get('attributes') or {}).get('OBJECTID')) for f in selected]
          bai4326=post(2,{'objectIds':','.join(oids),'outFields':'OBJECTID,id,nm_bai,nm,nm1,nm2,nm3,ql_bai','returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
          (OUT/'bairros_oficiais.geojson').write_text(json.dumps(bai4326,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          pubids=post(4,{'where':'1=1','geometry':envj,'geometryType':'esriGeometryEnvelope','inSR':'31982','spatialRel':'esriSpatialRelIntersects','returnIdsOnly':'true','f':'json'}).get('objectIds') or []
          pub=[]
          for i in range(0,len(pubids),150):
              fc=post(4,{'objectIds':','.join(map(str,pubids[i:i+150])),'outFields':'*','returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
              pub.extend(fc.get('features') or [])
          (OUT/'areas_publicas_candidates.geojson').write_text(json.dumps({'type':'FeatureCollection','features':pub},ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          manifest={'source':BASE,'filter_where':where,'selection_stage1':'official neighborhood envelope; exact neighborhood clipping/classification is local against official boundary polygons','selected_neighborhood_features':[{'target':f['_target'],'attributes':f.get('attributes')} for f in selected],'envelope_31982':env,'cadastro_candidate_ids':len(ids),'downloaded_candidates':len(feats),'public_candidate_ids':len(pubids),'output_sr':4326,'geometry_simplification':False,'maxAllowableOffset':None,'geometryPrecision':None,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-envelope-official-export
          path: spatial_envelope/
          if-no-files-found: error
