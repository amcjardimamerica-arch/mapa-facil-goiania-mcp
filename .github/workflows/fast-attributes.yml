name: Fast inspect cadastral attributes

on:
  push:
    branches: [fast-export]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download target attributes without geometry
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from pathlib import Path
          OUT=Path('fast_attributes'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          def get(layer, params):
              u=f'{BASE}/{layer}/query?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(u,headers={'User-Agent':'AMC-FastInspect/1.0'})
              with urllib.request.urlopen(req,timeout=120) as r: obj=json.loads(r.read())
              if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
              return obj
          where="UPPER(nmbairro) LIKE '%AMERICA%' OR UPPER(nmbairro) LIKE '%SUICA%' OR UPPER(nmbairro) LIKE '%SUIÇA%' OR UPPER(nmbairro) LIKE '%SUÍCA%' OR UPPER(nmbairro) LIKE '%SUÍÇA%'"
          fields='ESRI_OID,nrinscr,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,nrimovel,incompl,instatus,inposfisc,inrecadast,situacao,in_valido,ci,id,id_qdr,x_coord,y_coord,dtgeo,dtultalter'
          count=get(3,{'where':where,'returnCountOnly':'true','f':'json'})['count']
          obj=get(3,{'where':where,'outFields':fields,'returnGeometry':'false','orderByFields':'ESRI_OID ASC','resultRecordCount':1000000,'f':'json'})
          known1=get(3,{'where':"nrquadra LIKE '468%' AND nrlote LIKE '16%'",'outFields':fields,'returnGeometry':'false','f':'json'})
          known2=get(3,{'where':"nrquadra LIKE '606%' AND nrlote LIKE '17%'",'outFields':fields,'returnGeometry':'false','f':'json'})
          # Neighborhood names from official boundary layer, attributes only.
          bairros=get(2,{'where':'1=1','outFields':'OBJECTID,nm_bai,nm,nm1,nm2,nm3,ql_bai','returnGeometry':'false','resultRecordCount':1000000,'f':'json'})
          data={'where':where,'count':count,'records':obj.get('features',[]),'known_468_16':known1.get('features',[]),'known_606_17':known2.get('features',[]),'bairro_records':bairros.get('features',[]),'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'attributes.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('count',count,'records',len(data['records']),'bairros',len(data['bairro_records']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fast-attributes-export
          path: fast_attributes/
          if-no-files-found: error
