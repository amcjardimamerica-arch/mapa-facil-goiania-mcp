name: Bússola — testes

# Valida os dados, o extrator e o mapa (no Chromium) a cada alteração do projeto.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/bussola-testes.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bussola-testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dados:
    name: Dados e extrator (sem rede)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install shapely pytest
      - run: pytest -m "not navegador" -q

  navegador:
    name: Mapa no navegador + validação ao vivo
    runs-on: ubuntu-latest
    needs: dados
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m navegador -q
