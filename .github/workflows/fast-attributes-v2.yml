name: Fast inspect cadastral attributes v2

on:
  push:
    branches: [fast-attributes-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download target attributes in small pages
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from pathlib import Path
          OUT=Path('fast_attributes_v2'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-FastInspect-v2/1.0'}
          def get(layer, params, tries=6):
              u=f'{BASE}/{layer}/query?'+urllib.parse.urlencode(params)
              last=None
              for attempt in range(tries):
                  try:
                      req=urllib.request.Request(u,headers=UA)
                      with urllib.request.urlopen(req,timeout=120) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; time.sleep(2*(attempt+1))
              raise RuntimeError(f'failed after retries: {last} | {u}')
          where="UPPER(nmbairro) LIKE '%AMERICA%' OR UPPER(nmbairro) LIKE '%SUICA%' OR UPPER(nmbairro) LIKE '%SUIÇA%' OR UPPER(nmbairro) LIKE '%SUÍCA%' OR UPPER(nmbairro) LIKE '%SUÍÇA%'"
          fields='ESRI_OID,nrinscr,tplogradou,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,nrimovel,incompl,instatus,inposfisc,inrecadast,situacao,in_valido,ci,id,id_qdr,x_coord,y_coord,dtgeo,dtultalter'
          count=get(3,{'where':where,'returnCountOnly':'true','f':'json'})['count']
          records=[]
          page=500
          for off in range(0,count,page):
              obj=get(3,{'where':where,'outFields':fields,'returnGeometry':'false','orderByFields':'ESRI_OID ASC','resultOffset':off,'resultRecordCount':page,'f':'json'})
              batch=obj.get('features',[]); records.extend(batch)
              print('page',off,'got',len(batch),'total',len(records),flush=True)
          known=[]
          for q,l in [('468','16'),('606','17'),('228','16'),('4','21')]:
              obj=get(3,{'where':f"nrquadra LIKE '{q}%' AND nrlote LIKE '{l}%'",'outFields':fields,'returnGeometry':'false','f':'json'})
              known.append({'q':q,'l':l,'features':obj.get('features',[])})
          bcount=get(2,{'where':'1=1','returnCountOnly':'true','f':'json'})['count']
          bairros=[]
          for off in range(0,bcount,500):
              obj=get(2,{'where':'1=1','outFields':'OBJECTID,id,nm_bai,nm,nm1,nm2,nm3,ql_bai','returnGeometry':'false','orderByFields':'OBJECTID ASC','resultOffset':off,'resultRecordCount':500,'f':'json'})
              bairros.extend(obj.get('features',[]))
          data={'where':where,'count':count,'records':records,'known':known,'bairro_count':bcount,'bairro_records':bairros,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'attributes.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('DONE count',count,'records',len(records),'bairros',len(bairros))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fast-attributes-v2-export
          path: fast_attributes_v2/
          if-no-files-found: error
