name: Probe official cadastral codes

on:
  push:
    branches: [probe-official]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query small official samples and counts
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from pathlib import Path
          OUT=Path('probe'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-Probe/1.0'}
          def get(layer,params,tries=5):
              u=f'{BASE}/{layer}/query?'+urllib.parse.urlencode(params)
              last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(u,headers=UA)
                      with urllib.request.urlopen(req,timeout=90) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; time.sleep(2*(i+1))
              raise RuntimeError(f'{last} | {u}')
          fields='ESRI_OID,nrinscr,tplogradou,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,nrimovel'
          bairros={
            'JA':"nmbairro LIKE 'BRO JARDIM AMERICA%'",
            'NS':"nmbairro LIKE 'BRO NOVA SUICA%'"
          }
          out={'counts':{},'samples':{},'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          for key,bw in bairros.items():
              out['counts'][key]={'all':get(3,{'where':bw,'returnCountOnly':'true','f':'json'})['count'],'uso1':{},'propriedad':{},'combo':{}}
              for v in range(0,16):
                  out['counts'][key]['uso1'][str(v)]=get(3,{'where':f"({bw}) AND uso1={v}",'returnCountOnly':'true','f':'json'})['count']
              for v in range(0,11):
                  out['counts'][key]['propriedad'][str(v)]=get(3,{'where':f"({bw}) AND propriedad={v}",'returnCountOnly':'true','f':'json'})['count']
              for u in range(0,8):
                  out['counts'][key]['combo'][str(u)]=get(3,{'where':f"({bw}) AND uso1={u} AND propriedad=1",'returnCountOnly':'true','f':'json'})['count']
              out['samples'][key]=get(3,{'where':bw,'outFields':fields,'returnGeometry':'false','orderByFields':'ESRI_OID ASC','resultRecordCount':25,'f':'json'}).get('features',[])
          out['known']=[]
          for q,l in [('468','16'),('606','17'),('228','16'),('4','21'),('343','20')]:
              f=get(3,{'where':f"nrquadra LIKE '{q}%' AND nrlote LIKE '{l}%'",'outFields':fields,'returnGeometry':'false','resultRecordCount':100,'f':'json'}).get('features',[])
              out['known'].append({'q':q,'l':l,'features':f})
          (OUT/'probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out['counts'],ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: probe-official-export
          path: probe/
          if-no-files-found: error
