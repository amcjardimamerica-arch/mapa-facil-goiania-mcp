name: Export robust final official residential physical lots

on:
  push:
    branches: [final-robust]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export official records with strict OID filtering
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, re
          from pathlib import Path
          OUT=Path('final_robust'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-FinalRobust/1.0'}
          def post(params,tries=9,timeout=180):
              url=f'{BASE}/3/query'; data=urllib.parse.urlencode(params).encode(); last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(url,data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; print('retry',i+1,repr(e),flush=True); time.sleep(1.5*(i+1))
              raise RuntimeError(last)
          where="(nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%') AND uso=1 AND propriedad=1"
          raw_ids=post({'where':where,'returnIdsOnly':'true','f':'json'}).get('objectIds') or []
          ids=sorted(set(int(x) for x in raw_ids)); print('eligible OIDs',len(ids),flush=True)

          def fetch_attributes(wanted_ids, fields, batch=1500):
              out={}
              for pos in range(0,len(wanted_ids),batch):
                  want=set(wanted_ids[pos:pos+batch])
                  obj=post({'objectIds':','.join(map(str,sorted(want))),'outFields':fields,'returnGeometry':'false','f':'json'})
                  got={}
                  for f in obj.get('features',[]):
                      a=f.get('attributes') or {}
                      try: oid=int(a.get('ESRI_OID'))
                      except: continue
                      if oid in want: got[oid]=a
                  missing=want-set(got)
                  # Recover any omitted IDs in smaller groups; ignore server-returned extras.
                  if missing:
                      print('attr missing initial',len(missing),'at',pos,flush=True)
                      for mpos in range(0,len(missing),100):
                          mw=set(sorted(missing)[mpos:mpos+100])
                          o2=post({'objectIds':','.join(map(str,sorted(mw))),'outFields':fields,'returnGeometry':'false','f':'json'})
                          for f in o2.get('features',[]):
                              a=f.get('attributes') or {}
                              try: oid=int(a.get('ESRI_OID'))
                              except: continue
                              if oid in mw: got[oid]=a
                  still=want-set(got)
                  if still: raise RuntimeError(f'attributes missing OIDs: {sorted(still)[:20]} count={len(still)}')
                  out.update(got); print('attrs',len(out),'/',len(wanted_ids),flush=True)
              return out

          af='ESRI_OID,nrinscr,tplogradou,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,dtgeo,dtultalter'
          amap=fetch_attributes(ids,af)
          if set(amap)!=set(ids): raise RuntimeError('attribute OID set mismatch')

          def n(s):
              s=''.join(str(s or '').strip().upper().split())
              return str(int(s)) if s.isdigit() else s
          def score(a):
              try: sub=int(a.get('insubprinc'))
              except: sub=10**9
              return (0 if sub==0 else 1,sub,int(a.get('ESRI_OID') or 10**9))
          groups={}
          for oid in ids:
              a=amap[oid]
              key=((a.get('nmbairro') or '').strip(),n(a.get('nrquadra')),n(a.get('nrlote')))
              groups.setdefault(key,[]).append(a)
          chosen=[]; dups=[]; by_bairro={}
          for key,arr in groups.items():
              arr.sort(key=score); keep=arr[0]; chosen.append(int(keep['ESRI_OID']))
              by_bairro[key[0]]=by_bairro.get(key[0],0)+1
              if len(arr)>1:
                  dups.append({'bairro':key[0],'quadra':key[1],'lote':key[2],'count':len(arr),'kept_oid':keep['ESRI_OID'],'kept_nrinscr':keep['nrinscr'],'kept_insubprinc':keep.get('insubprinc'),'ttsublot_values':sorted(set(x.get('ttsublot') for x in arr if x.get('ttsublot') is not None))})
          chosen=sorted(set(chosen)); print('unique QL selected',len(chosen),'by bairro',by_bairro,flush=True)

          def fetch_geojson(wanted_ids, fields, batch=500):
              out={}
              for pos in range(0,len(wanted_ids),batch):
                  want=set(wanted_ids[pos:pos+batch])
                  obj=post({'objectIds':','.join(map(str,sorted(want))),'outFields':fields,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
                  got={}
                  for f in obj.get('features',[]):
                      p=f.get('properties') or {}
                      try: oid=int(p.get('ESRI_OID'))
                      except: continue
                      if oid in want: got[oid]=f
                  missing=want-set(got)
                  if missing:
                      print('geom missing initial',len(missing),'at',pos,flush=True)
                      for mpos in range(0,len(missing),50):
                          mw=set(sorted(missing)[mpos:mpos+50])
                          o2=post({'objectIds':','.join(map(str,sorted(mw))),'outFields':fields,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
                          for f in o2.get('features',[]):
                              p=f.get('properties') or {}
                              try: oid=int(p.get('ESRI_OID'))
                              except: continue
                              if oid in mw: got[oid]=f
                  still=want-set(got)
                  if still: raise RuntimeError(f'geometry missing OIDs: {sorted(still)[:20]} count={len(still)}')
                  out.update(got); print('geoms',len(out),'/',len(wanted_ids),flush=True)
              return out
          gmap=fetch_geojson(chosen,af)
          if set(gmap)!=set(chosen): raise RuntimeError('geometry OID set mismatch')
          features=[gmap[oid] for oid in chosen]
          (OUT/'cadastro_residencial_particular_physical.geojson').write_text(json.dumps({'type':'FeatureCollection','features':features},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          manifest={'source':BASE+'/3','where':where,'eligible_oid_count':len(ids),'raw_eligible_records':len(ids),'unique_bairro_quadra_lote':len(groups),'selected_records':len(chosen),'counts_by_raw_bairro_unique_ql':by_bairro,'duplicate_records_consolidated':len(ids)-len(chosen),'duplicate_ql_groups':len(dups),'selection_rule':'one official record per bairro+quadra+lote; prefer insubprinc=0 when present, otherwise lowest official insubprinc, then OID; responses strictly post-filtered by requested ESRI_OID','outSR':4326,'no_geometry_simplification':True,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'duplicate_groups.json').write_text(json.dumps(dups,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-robust-official-export
          path: final_robust/
          if-no-files-found: error
