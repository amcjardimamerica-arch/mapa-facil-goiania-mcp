name: All target official attributes by ESRI_OID keyset

on:
  push:
    branches: [all-target-keyset]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export all cadastral attributes in target neighborhoods by keyset
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,time
          from pathlib import Path
          OUT=Path('all_target_keyset');OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          TARGET="nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%'"
          UA={'User-Agent':'AMC-AllTargetKeyset/1.0'}
          def post(params,tries=8):
            data=urllib.parse.urlencode(params).encode();last=None
            for i in range(tries):
              try:
                req=urllib.request.Request(BASE+'/3/query',data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                with urllib.request.urlopen(req,timeout=180) as r:o=json.loads(r.read())
                if isinstance(o,dict) and o.get('error'):raise RuntimeError(o['error'])
                return o
              except Exception as e:last=e;print('retry',i+1,repr(e),flush=True);time.sleep(1.5*(i+1))
            raise RuntimeError(last)
          fields='ESRI_OID,nrinscr,nmlogradou,tplogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot'
          amap={};last=-1;pages=0
          while True:
            w=f'({TARGET}) AND ESRI_OID > {last}'
            o=post({'where':w,'outFields':fields,'returnGeometry':'false','orderByFields':'ESRI_OID ASC','resultRecordCount':750,'f':'json'})
            fs=o.get('features') or []
            if not fs:break
            oids=[]
            for f in fs:
              a=f.get('attributes') or {};oid=int(a['ESRI_OID']);oids.append(oid)
              if oid<=last:raise RuntimeError(f'non-increasing {oid} <= {last}')
              if (a.get('nmbairro') or '').strip() not in ('BRO JARDIM AMERICA','BRO NOVA SUICA'):raise RuntimeError(f'escaped target {a}')
              amap[oid]=a
            if oids!=sorted(oids) or len(oids)!=len(set(oids)):raise RuntimeError('page OIDs invalid')
            last=max(oids);pages+=1;print('page',pages,'got',len(fs),'total',len(amap),'last',last,flush=True)
            if len(fs)<750:
              chk=post({'where':f'({TARGET}) AND ESRI_OID > {last}','returnCountOnly':'true','f':'json'}).get('count',0)
              if chk==0:break
          count_check=post({'where':TARGET,'returnCountOnly':'true','f':'json'}).get('count')
          ids=sorted(amap)
          (OUT/'all_target_attributes.json').write_text(json.dumps({'count':len(ids),'records':[{'attributes':amap[x]} for x in ids]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          man={'source':BASE+'/3','where':TARGET,'query_method':'keyset pagination WHERE ESRI_OID > last_id ORDER BY ESRI_OID; no resultOffset/objectIds/returnIdsOnly','pages':pages,'record_count':len(ids),'independent_count_check':count_check,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(man,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(man,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-target-keyset-official-export
          path: all_target_keyset/
          if-no-files-found: error
