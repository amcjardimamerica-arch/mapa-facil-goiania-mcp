name: Diagnose official Goiânia cadastral codes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Export broad official records
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from pathlib import Path
          OUT=Path('diagnostic_export'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-JardimAmerica-Diagnostic/1.0'}
          def get(url, p, timeout=120):
              full=url+'?'+urllib.parse.urlencode(p)
              req=urllib.request.Request(full,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
              if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
              return obj
          def export(layer, where, fields, name, page=3000):
              cnt=get(f'{BASE}/{layer}/query',{'where':where,'returnCountOnly':'true','f':'json'})['count']
              feats=[]
              for off in range(0,cnt,page):
                  fc=get(f'{BASE}/{layer}/query',{
                      'where':where,'outFields':fields,'returnGeometry':'true',
                      'returnZ':'false','returnM':'false','outSR':'4326',
                      'orderByFields':('ESRI_OID ASC' if layer==3 else 'OBJECTID ASC'),
                      'resultOffset':off,'resultRecordCount':page,'f':'geojson'})
                  feats.extend(fc.get('features',[]))
              (OUT/name).write_text(json.dumps({'type':'FeatureCollection','features':feats},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              return cnt,len(feats)
          where3="UPPER(nmbairro) LIKE '%AMERICA%' OR UPPER(nmbairro) LIKE '%SUICA%' OR UPPER(nmbairro) LIKE '%SUÍCA%' OR UPPER(nmbairro) LIKE '%SUIÇA%' OR UPPER(nmbairro) LIKE '%SUÍÇA%'"
          fields3='ESRI_OID,nrinscr,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,nrimovel,incompl,instatus,inposfisc,inrecadast,situacao,in_valido,ci,id,id_qdr,x_coord,y_coord,dtgeo,dtultalter'
          c3,n3=export(3,where3,fields3,'cadastro_amplo.geojson')
          where2="UPPER(nm_bai) LIKE '%AMERICA%' OR UPPER(nm_bai) LIKE '%AMÉRICA%' OR UPPER(nm_bai) LIKE '%SUICA%' OR UPPER(nm_bai) LIKE '%SUIÇA%' OR UPPER(nm_bai) LIKE '%SUÍÇA%'"
          c2,n2=export(2,where2,'OBJECTID,id,nm_bai,nm,nm1,nm2,nm3,ql_bai','bairros_amplo.geojson')
          # Targeted known legacy lot for code interpretation.
          known=get(f'{BASE}/3/query',{
              'where':"nrquadra = '468' AND nrlote = '16'",
              'outFields':fields3,'returnGeometry':'true','outSR':'4326','f':'geojson'})
          (OUT/'known_q468_l16.geojson').write_text(json.dumps(known,ensure_ascii=False,indent=2),encoding='utf-8')
          manifest={'where3':where3,'count3':c3,'downloaded3':n3,'where2':where2,'count2':c2,'downloaded2':n2,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Upload diagnostic export
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-goiania-export
          path: diagnostic_export/
          if-no-files-found: error
