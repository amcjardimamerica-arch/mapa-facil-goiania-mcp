name: All target attributes via ESRI_OID SQL

on:
  push:
    branches: [all-target-correct-esri-where]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export every cadastral record in both target neighborhoods
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,time,collections
          from pathlib import Path
          OUT=Path('all_target_correct');OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          TARGET="nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%'"
          UA={'User-Agent':'AMC-AllTargetCorrect/1.0'}
          def post(params,tries=7):
            url=BASE+'/3/query';data=urllib.parse.urlencode(params).encode();last=None
            for i in range(tries):
              try:
                req=urllib.request.Request(url,data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                with urllib.request.urlopen(req,timeout=180) as r:o=json.loads(r.read())
                if isinstance(o,dict) and o.get('error'):raise RuntimeError(o['error'])
                return o
              except Exception as e:last=e;print('retry',i+1,repr(e),flush=True);time.sleep(1.5*(i+1))
            raise RuntimeError(last)
          sets=[]
          for i in range(3):
            o=post({'where':TARGET,'returnIdsOnly':'true','f':'json'});s=frozenset(int(x) for x in (o.get('objectIds') or []));sets.append(s);print('ids',i+1,len(s),flush=True);time.sleep(1)
          c=collections.Counter(sets);ids_set,freq=c.most_common(1)[0]
          if freq<2:raise RuntimeError('unstable target ID sets')
          ids=sorted(ids_set)
          fields='ESRI_OID,nrinscr,nmlogradou,tplogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot'
          def fetch(want):
            want=sorted(set(want))
            if not want:return {}
            if len(want)>700:
              z={}
              for i in range(0,len(want),700):z.update(fetch(want[i:i+700]))
              return z
            clause='ESRI_OID IN ('+','.join(map(str,want))+')'
            try:o=post({'where':f'({TARGET}) AND {clause}','outFields':fields,'returnGeometry':'false','f':'json'},tries=4)
            except Exception:
              if len(want)<=25:raise
              m=len(want)//2;z=fetch(want[:m]);z.update(fetch(want[m:]));return z
            W=set(want);g={}
            for f in o.get('features',[]):
              a=f.get('attributes') or {}
              try:oid=int(a.get('ESRI_OID'))
              except:continue
              if oid in W and (a.get('nmbairro') or '').strip() in ('BRO JARDIM AMERICA','BRO NOVA SUICA'):g[oid]=a
            miss=sorted(W-set(g))
            if miss:
              if len(want)<=25:raise RuntimeError(f'missing {miss}')
              g.update(fetch(miss))
            return g
          amap={}
          for i in range(0,len(ids),1400):amap.update(fetch(ids[i:i+1400]));print('attrs',len(amap),'/',len(ids),flush=True)
          if set(amap)!=set(ids):raise RuntimeError('attribute set mismatch')
          data={'count':len(ids),'records':[{'attributes':amap[x]} for x in ids]}
          (OUT/'all_target_attributes.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps({'source':BASE+'/3','where':TARGET,'id_pass_counts':[len(x) for x in sets],'stable_frequency':freq,'record_count':len(ids),'query_method':'SQL WHERE ESRI_OID IN (...) with target filter','generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-target-correct-official-export
          path: all_target_correct/
          if-no-files-found: error
