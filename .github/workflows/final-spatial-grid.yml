name: Final official export by spatial grid

on:
  push:
    branches: [final-spatial-grid]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export all target attributes spatially and exact physical geometries
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time, collections, math
          from pathlib import Path

          OUT=Path('final_spatial_grid'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-FinalSpatialGrid/1.0'}
          FIELDS='ESRI_OID,OBJECTID,nrinscr,tplogradou,nmlogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot,dtgeo,dtultalter'

          def post(layer, params, tries=8, timeout=180):
              data=urllib.parse.urlencode(params).encode('utf-8'); last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(f'{BASE}/{layer}/query',data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; print('retry',layer,i+1,repr(e),flush=True); time.sleep(1.5*(i+1))
              raise RuntimeError(last)

          # Official neighborhood polygons, requested from official layer 2 in WGS84.
          bfc=post(2,{'where':'OBJECTID=770 OR OBJECTID=1075','outFields':'OBJECTID,nm_bai,nm,nm1,nm2,nm3,ql_bai','returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'})
          targets={}
          for f in bfc.get('features',[]):
              p=f.get('properties') or {}; nm=(p.get('nm_bai') or p.get('nm') or '').upper()
              if 'JARDIM' in nm and 'AM' in nm: raw='BRO JARDIM AMERICA'
              elif 'NOVA' in nm and ('SU' in nm): raw='BRO NOVA SUICA'
              else: continue
              xs=[];ys=[]
              def walk(c):
                  if isinstance(c,(list,tuple)) and len(c)>=2 and isinstance(c[0],(int,float)) and isinstance(c[1],(int,float)):
                      xs.append(float(c[0]));ys.append(float(c[1]));return
                  if isinstance(c,(list,tuple)):
                      for z in c: walk(z)
              walk((f.get('geometry') or {}).get('coordinates'))
              if not xs: raise RuntimeError('empty official bairro geometry')
              targets[raw]={'bbox':(min(xs),min(ys),max(xs),max(ys)),'feature':f}
          if set(targets)!= {'BRO JARDIM AMERICA','BRO NOVA SUICA'}: raise RuntimeError(f'Official target bairros not resolved: {targets.keys()}')
          (OUT/'bairros_oficiais.geojson').write_text(json.dumps(bfc,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('official bboxes',{k:v['bbox'] for k,v in targets.items()},flush=True)

          def envjson(env):
              xmin,ymin,xmax,ymax=env
              return json.dumps({'xmin':xmin,'ymin':ymin,'xmax':xmax,'ymax':ymax,'spatialReference':{'wkid':4326}},separators=(',',':'))
          def split4(env):
              xmin,ymin,xmax,ymax=env; xm=(xmin+xmax)/2; ym=(ymin+ymax)/2
              return [(xmin,ymin,xm,ym),(xm,ymin,xmax,ym),(xmin,ym,xm,ymax),(xm,ym,xmax,ymax)]
          def spatial_params(where,env):
              return {'where':where,'geometry':envjson(env),'geometryType':'esriGeometryEnvelope','inSR':'4326','spatialRel':'esriSpatialRelIntersects'}

          # Collect every cadastral attribute in each official neighborhood bounding box.
          # Recursive subdivision ensures no transfer-limit truncation. OIDs are deduplicated because polygons can cross tile edges.
          all_attrs={}; tile_stats=[]
          def collect_tile(raw_bairro, env, depth=0):
              where=f"nmbairro LIKE '{raw_bairro}%'"
              base=spatial_params(where,env)
              cnt=int(post(3,{**base,'returnCountOnly':'true','f':'json'}).get('count') or 0)
              if cnt==0:
                  tile_stats.append({'bairro':raw_bairro,'depth':depth,'count':0,'fetched':0}); return
              if cnt>700 and depth<10:
                  for sub in split4(env): collect_tile(raw_bairro,sub,depth+1)
                  return
              obj=post(3,{**base,'outFields':FIELDS,'returnGeometry':'false','resultRecordCount':'1000','f':'json'})
              fs=obj.get('features') or []
              got={}
              for f in fs:
                  a=f.get('attributes') or {}
                  try: oid=int(a.get('ESRI_OID'))
                  except: continue
                  if (a.get('nmbairro') or '').strip()!=raw_bairro: continue
                  got[oid]=a
              # If the server still truncated this cell, subdivide instead of accepting a partial response.
              if len(got)<cnt:
                  if depth>=12:
                      raise RuntimeError(f'Tile remained truncated bairro={raw_bairro} depth={depth} count={cnt} fetched={len(got)} env={env}')
                  print('subdivide truncated tile',raw_bairro,depth,cnt,len(got),flush=True)
                  for sub in split4(env): collect_tile(raw_bairro,sub,depth+1)
                  return
              all_attrs.update(got)
              tile_stats.append({'bairro':raw_bairro,'depth':depth,'count':cnt,'fetched':len(got)})

          # Initial 8x8 grid per official bbox keeps each request small even before recursive subdivision.
          for raw_bairro,info in targets.items():
              xmin,ymin,xmax,ymax=info['bbox']; nx=8; ny=8
              for ix in range(nx):
                  for iy in range(ny):
                      x0=xmin+(xmax-xmin)*ix/nx; x1=xmin+(xmax-xmin)*(ix+1)/nx
                      y0=ymin+(ymax-ymin)*iy/ny; y1=ymin+(ymax-ymin)*(iy+1)/ny
                      collect_tile(raw_bairro,(x0,y0,x1,y1),0)
              print('spatial attrs after',raw_bairro,len(all_attrs),flush=True)

          # Global counts are diagnostic only. The authoritative set is the spatially collected, OID-deduplicated payload.
          global_counts={}
          for raw_bairro in targets:
              global_counts[raw_bairro]=int(post(3,{'where':f"nmbairro LIKE '{raw_bairro}%'",'returnCountOnly':'true','f':'json'}).get('count') or 0)
          spatial_counts=collections.Counter((a.get('nmbairro') or '').strip() for a in all_attrs.values())
          print('global counts',global_counts,'spatial unique',dict(spatial_counts),flush=True)

          # Eligible records use the verified current API semantics: uso=1 (residential) + propriedad=1 (private).
          eligible={oid:a for oid,a in all_attrs.items() if a.get('uso')==1 and a.get('propriedad')==1}
          def normid(s):
              s=''.join(str(s or '').strip().upper().split())
              return str(int(s)) if s.isdigit() else s
          def score(a):
              try: sub=int(a.get('insubprinc'))
              except: sub=10**9
              try: tt=int(a.get('ttsublot'))
              except: tt=10**9
              return (0 if sub==0 else 1,0 if tt==1 else 1,sub,int(a['ESRI_OID']))
          groups={}
          for oid,a in eligible.items():
              key=((a.get('nmbairro') or '').strip(),normid(a.get('nrquadra')),normid(a.get('nrlote')))
              groups.setdefault(key,[]).append(a)
          chosen=[]; dups=[]; by_bairro=collections.Counter()
          for key,arr in groups.items():
              arr.sort(key=score); keep=arr[0]; chosen.append(int(keep['ESRI_OID'])); by_bairro[key[0]]+=1
              if len(arr)>1:
                  dups.append({'bairro':key[0],'quadra':key[1],'lote':key[2],'count':len(arr),'kept_oid':keep['ESRI_OID'],'kept_nrinscr':keep.get('nrinscr'),'kept_insubprinc':keep.get('insubprinc'),'kept_ttsublot':keep.get('ttsublot'),'other_oids':[int(x['ESRI_OID']) for x in arr[1:]]})
          chosen=sorted(set(chosen)); print('eligible records',len(eligible),'physical QL chosen',len(chosen),'by bairro',dict(by_bairro),flush=True)

          # Fetch only the selected official geometries. SQL ESRI_OID IN is the method independently proven to map to the actual OID field.
          def fetch_geo(wanted):
              wanted=sorted(set(int(x) for x in wanted))
              if not wanted:return {}
              if len(wanted)>180:
                  z={}
                  for i in range(0,len(wanted),180): z.update(fetch_geo(wanted[i:i+180]))
                  return z
              # Split batches by bairro so each request carries an exact target predicate.
              byb=collections.defaultdict(list)
              for oid in wanted: byb[(eligible[oid].get('nmbairro') or '').strip()].append(oid)
              out={}
              for raw_bairro,ids in byb.items():
                  clause='ESRI_OID IN ('+','.join(map(str,ids))+')'
                  where=f"nmbairro LIKE '{raw_bairro}%' AND uso=1 AND propriedad=1 AND {clause}"
                  try:
                      obj=post(3,{'where':where,'outFields':FIELDS,'returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'geojson'},tries=5)
                  except Exception:
                      if len(ids)<=8: raise
                      mid=len(ids)//2; out.update(fetch_geo(ids[:mid])); out.update(fetch_geo(ids[mid:])); continue
                  got={}
                  for f in obj.get('features',[]):
                      p=f.get('properties') or {}
                      try: oid=int(p.get('ESRI_OID'))
                      except: continue
                      if oid in ids and (p.get('nmbairro') or '').strip()==raw_bairro and p.get('uso')==1 and p.get('propriedad')==1 and f.get('geometry'):
                          got[oid]=f
                  missing=sorted(set(ids)-set(got))
                  if missing:
                      if len(ids)<=8: raise RuntimeError(f'Missing selected geometries {missing} bairro={raw_bairro}')
                      got.update(fetch_geo(missing))
                  out.update(got)
              return out

          gmap={}
          for i in range(0,len(chosen),360):
              gmap.update(fetch_geo(chosen[i:i+360])); print('geometry',len(gmap),'/',len(chosen),flush=True)
          if set(gmap)!=set(chosen): raise RuntimeError(f'Final selected geometry OID mismatch got={len(gmap)} want={len(chosen)}')
          features=[gmap[x] for x in chosen]

          # Payload-level eligibility and source checks.
          for f in features:
              p=f.get('properties') or {}
              if (p.get('nmbairro') or '').strip() not in targets or p.get('uso')!=1 or p.get('propriedad')!=1 or not f.get('geometry'):
                  raise RuntimeError(f'Ineligible final feature escaped filters: {p}')

          (OUT/'cadastro_residencial_particular_physical.geojson').write_text(json.dumps({'type':'FeatureCollection','features':features},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'all_target_attributes.json').write_text(json.dumps({'count':len(all_attrs),'records':[{'attributes':all_attrs[x]} for x in sorted(all_attrs)]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'eligible_attributes.json').write_text(json.dumps({'count':len(eligible),'records':[{'attributes':eligible[x]} for x in sorted(eligible)]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'duplicate_groups.json').write_text(json.dumps(dups,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (OUT/'tile_stats.json').write_text(json.dumps(tile_stats,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          manifest={
              'source':BASE+'/3','bairro_source':BASE+'/2','method':'official neighborhood bounding boxes + recursive spatial grid; all target attributes deduped by ESRI_OID; eligible geometry fetched via SQL ESRI_OID IN; no resultOffset, no objectIds, no returnIdsOnly for data selection',
              'official_bairro_objectids':[770,1075],'global_raw_bairro_counts_diagnostic':global_counts,'spatial_unique_all_target_records':len(all_attrs),'spatial_counts_by_bairro':dict(spatial_counts),
              'raw_eligible_records':len(eligible),'unique_bairro_quadra_lote':len(groups),'selected_records':len(chosen),'counts_by_raw_bairro_unique_ql':dict(by_bairro),
              'duplicate_records_consolidated':len(eligible)-len(chosen),'duplicate_ql_groups':len(dups),'selection_rule':'one official record per bairro+quadra+lote; prefer insubprinc=0, then ttsublot=1, then lowest insubprinc, then ESRI_OID',
              'outSR':4326,'no_geometry_simplification':True,'tile_leaf_requests':len(tile_stats),'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          }
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-spatial-grid-official-export
          path: final_spatial_grid/
          if-no-files-found: error
