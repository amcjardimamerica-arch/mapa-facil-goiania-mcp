name: Export all target cadastral attributes robustly

on:
  push:
    branches: [all-target-robust]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export all target attributes with strict OID filtering
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          from pathlib import Path
          OUT=Path('all_target_robust'); OUT.mkdir(exist_ok=True)
          BASE='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer'
          UA={'User-Agent':'AMC-AllTargetRobust/1.0'}
          def post(params,tries=9,timeout=180):
              url=f'{BASE}/3/query'; data=urllib.parse.urlencode(params).encode(); last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(url,data=data,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
                      if isinstance(obj,dict) and obj.get('error'): raise RuntimeError(obj['error'])
                      return obj
                  except Exception as e:
                      last=e; print('retry',i+1,repr(e),flush=True); time.sleep(1.5*(i+1))
              raise RuntimeError(last)
          where="nmbairro LIKE 'BRO JARDIM AMERICA%' OR nmbairro LIKE 'BRO NOVA SUICA%'"
          ids=sorted(set(int(x) for x in (post({'where':where,'returnIdsOnly':'true','f':'json'}).get('objectIds') or [])))
          print('target OIDs',len(ids),flush=True)
          fields='ESRI_OID,nrinscr,nmlogradou,tplogradou,nrquadra,nrlote,nmbairro,areaterr,propriedad,uso,uso1,uso2,insubprinc,ttsublot'
          out={}
          for pos in range(0,len(ids),1500):
              want=set(ids[pos:pos+1500])
              obj=post({'objectIds':','.join(map(str,sorted(want))),'outFields':fields,'returnGeometry':'false','f':'json'})
              got={}
              for f in obj.get('features',[]):
                  a=f.get('attributes') or {}
                  try: oid=int(a.get('ESRI_OID'))
                  except: continue
                  if oid in want: got[oid]=a
              missing=want-set(got)
              if missing:
                  print('missing initial',len(missing),flush=True)
                  for p2 in range(0,len(missing),100):
                      mw=set(sorted(missing)[p2:p2+100])
                      o2=post({'objectIds':','.join(map(str,sorted(mw))),'outFields':fields,'returnGeometry':'false','f':'json'})
                      for f in o2.get('features',[]):
                          a=f.get('attributes') or {}
                          try: oid=int(a.get('ESRI_OID'))
                          except: continue
                          if oid in mw: got[oid]=a
              still=want-set(got)
              if still: raise RuntimeError(f'missing OIDs {len(still)} {sorted(still)[:20]}')
              out.update(got); print('attrs',len(out),'/',len(ids),flush=True)
          if set(out)!=set(ids): raise RuntimeError('OID set mismatch')
          records=[{'attributes':out[oid]} for oid in ids]
          (OUT/'all_target_attributes.json').write_text(json.dumps({'where':where,'count':len(ids),'records':records},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          manifest={'source':BASE+'/3','where':where,'oid_count':len(ids),'downloaded_unique_oid_count':len(out),'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-target-robust-official-export
          path: all_target_robust/
          if-no-files-found: error
