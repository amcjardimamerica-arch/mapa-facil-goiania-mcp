name: Final official geometry from Divisas de Lote
on:
  push:
    branches: [final-layer0-geometry]
permissions:
  contents: read
  actions: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: final-official-attributes
          path: final_attributes
          repository: amcjardimamerica-arch/mapa-facil-goiania-mcp
          run-id: 31530300264
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - shell: bash
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,time,collections,concurrent.futures,shutil,re
          from pathlib import Path
          A=Path('final_attributes');O=Path('final_layer0');O.mkdir(exist_ok=True)
          B='https://portalmapa.goiania.go.gov.br/servicogyn/rest/services/MapaServer/Feature_Base/MapServer/0/query'
          sel=json.loads((A/'selected_physical_records.json').read_text())['records']
          def nid(x):
            s=''.join(str(x or '').strip().upper().split());return str(int(s)) if re.fullmatch(r'\d+',s) else s
          def quote(x):return "'"+x.replace("'","''")+"'"
          targets={}
          for a in sel:
            ins=str(a.get('nrinscr') or '').strip()
            if len(ins)<10 or not ins[:10].isdigit():raise RuntimeError(f'bad nrinscr {ins}')
            targets[ins]=(ins[:10],nid(a.get('nrlote')),a)
          cis=sorted(set(v[0] for v in targets.values()))
          def fetch_ci_batch(batch,tries=6):
            where='ci IN ('+','.join(quote(x) for x in batch)+')'
            p={'where':where,'outFields':'OBJECTID,id,nm_lot,nm_imovel,id_qdr,ci_lot,ci_qdr,ci,in_cond,nm_cond','returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','resultRecordCount':'5000','f':'geojson'}
            data=urllib.parse.urlencode(p).encode();last=None
            for i in range(tries):
              try:
                req=urllib.request.Request(B,data=data,headers={'User-Agent':'AMC-Layer0Final/1.0','Content-Type':'application/x-www-form-urlencoded'})
                with urllib.request.urlopen(req,timeout=150) as r:o=json.loads(r.read())
                if o.get('error'):raise RuntimeError(o['error'])
                if o.get('exceededTransferLimit'):raise RuntimeError('transfer limit')
                return o.get('features') or []
              except Exception as e:last=e;time.sleep(1.0*(i+1))
            if len(batch)<=1:raise RuntimeError(last)
            m=len(batch)//2;return fetch_ci_batch(batch[:m])+fetch_ci_batch(batch[m:])
          batches=[cis[i:i+80] for i in range(0,len(cis),80)]; feats=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
            futs=[ex.submit(fetch_ci_batch,b) for b in batches]
            for n,f in enumerate(concurrent.futures.as_completed(futs),1):
              z=f.result();feats.extend(z);print('batch',n,'/',len(batches),'features',len(feats),flush=True)
          # Deduplicate identical layer0 feature IDs if server repeated a row.
          unique={}
          for f in feats:
            p=f.get('properties') or {}; oid=p.get('OBJECTID')
            if oid is None or not f.get('geometry'):continue
            unique[int(oid)]=f
          by_ci_lot=collections.defaultdict(list)
          for f in unique.values():
            p=f.get('properties') or {};ci=str(p.get('ci') or '').strip();lot=nid(p.get('nm_lot'))
            by_ci_lot[(ci,lot)].append(f)
          out=[];multipart=[];missing=[]
          for a in sel:
            ins=str(a['nrinscr']).strip();ci,lot,_=targets[ins]; cand=by_ci_lot.get((ci,lot),[])
            if not cand:
              missing.append({'nrinscr':ins,'ci':ci,'lote':lot,'quadra':a.get('nrquadra'),'bairro':a.get('nmbairro')});continue
            # All returned candidates are official Divisas de Lote components with same cadastral CI + lot label.
            # Keep one polygon if singular; preserve every distinct official component as a MultiPolygon when multipart.
            geoms=[]; seen=set()
            for f in cand:
              g=f['geometry']; sig=json.dumps(g,sort_keys=True,separators=(',',':'))
              if sig not in seen:seen.add(sig);geoms.append(g)
            if len(geoms)==1: geom=geoms[0]
            else:
              polys=[]
              for g in geoms:
                if g.get('type')=='Polygon':polys.append(g['coordinates'])
                elif g.get('type')=='MultiPolygon':polys.extend(g['coordinates'])
                else:raise RuntimeError(f'unsupported layer0 geometry {g.get("type")}')
              geom={'type':'MultiPolygon','coordinates':polys}
              multipart.append({'nrinscr':ins,'quadra':a.get('nrquadra'),'lote':a.get('nrlote'),'ci':ci,'components':len(polys),'layer0_objectids':[f.get('properties',{}).get('OBJECTID') for f in cand]})
            out.append({'type':'Feature','properties':a,'geometry':geom})
          if missing:raise RuntimeError(f'missing layer0 geometry count={len(missing)} sample={missing[:20]}')
          if len(out)!=len(sel):raise RuntimeError(f'output {len(out)} != selected {len(sel)}')
          (O/'cadastro_residencial_particular_physical.geojson').write_text(json.dumps({'type':'FeatureCollection','features':out},ensure_ascii=False,separators=(',',':')))
          for nm in ['manifest.json','all_target_attributes.json','eligible_attributes.json','duplicate_groups.json','selected_physical_records.json']:shutil.copy2(A/nm,O/nm)
          gman={'source':'Feature_Base/MapServer/0 Divisas de Lote','join':'first 10 digits of nrinscr = ci AND normalized nrlote = nm_lot','selected_records':len(sel),'geometry_records':len(out),'unique_ci_prefixes':len(cis),'layer0_features_fetched':len(unique),'multipart_lots':multipart,'missing_count':0,'outSR':4326,'no_geometry_simplification':True,'generated_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (O/'geometry_manifest.json').write_text(json.dumps(gman,ensure_ascii=False,indent=2))
          print(json.dumps({'selected':len(sel),'features':len(out),'multipart_count':len(multipart),'multipart_sample':multipart[:20]},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-layer0-official-geometry
          path: final_layer0/
          if-no-files-found: error
