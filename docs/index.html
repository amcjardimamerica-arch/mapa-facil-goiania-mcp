  <section class="entrada">
    <header class="marca">
      <h1>Bússola</h1>
      <p>Sistema de navegação da Associação.</p>
    </header>

    <form id="form-acesso" class="cartao" novalidate autocomplete="on">
      <h2>Entrar</h2>
      <label class="campo-rotulo" for="login">Usuário</label>
      <input id="login" name="username" class="campo" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label class="campo-rotulo" for="senha">Senha</label>
      <div class="campo-senha">
        <input id="senha" name="password" type="password" class="campo" autocomplete="current-password" required>
        <button type="button" id="mostrar-senha" class="olho" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
      </div>
      <label class="lembrar"><input type="checkbox" id="lembrar"> Manter conectado neste aparelho por 30 dias</label>
      <p id="mensagem" class="mensagem" role="alert" hidden></p>
      <button id="entrar" class="botao-entrar" type="submit">Entrar</button>
      <p class="ajuda">Sem acesso ou esqueceu a senha? Fale com a diretoria da Associação.</p>
    </form>

    <div id="ja-conectado" class="cartao" hidden>
      <h2 id="saudacao">Olá</h2>
      <p class="ajuda">Você já está conectado neste aparelho.</p>
      <a id="abrir-sistema" class="botao-entrar" href="sistema.html">Abrir a Bússola</a>
      <button id="sair" type="button" class="botao-sair">Sair desta conta</button>
    </div>
  </section>
</main>
<noscript><p class="sem-js">A Bússola precisa de JavaScript ativado.</p></noscript>
