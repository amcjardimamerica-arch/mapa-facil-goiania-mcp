<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="js/guarda.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs de acesso — Bússola</title>
<meta name="theme-color" content="#1f2226">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { overflow: auto; height: auto; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 18px 60px; display: flex; flex-direction: column; gap: 18px; }
  header.v { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  header.v h1 { margin: 0; font-size: 24px; font-weight: 650; }
  .grupo-v { background: var(--fundo); border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; }
  .grupo-v h2 { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--linha); }
  .logs-corpo { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .logs-corpo .campo { max-width: 320px; }
  .logs-tabela { overflow-x: auto; }
  #logs-tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #logs-tabela th, #logs-tabela td { text-align: left; padding: 7px 8px; border-top: 1px solid #2d3238; vertical-align: top; }
  #logs-tabela th { color: var(--texto-2); font-weight: 600; white-space: nowrap; }
  #logs-tabela small { display: block; color: var(--texto-2); }
</style>
</head>
<body>
<main>
  <header class="v">
    <div><h1>Logs de acesso</h1><p class="nota">Quem acessou o sistema, quando, de onde e com qual aparelho.</p></div>
    <div class="linha-botoes"><a class="botao" href="sistema.html">Abrir o mapa</a></div>
  </header>
  <section id="logs" class="grupo-v logs" aria-labelledby="logs-titulo">
    <h2 id="logs-titulo">Acessos registrados</h2>
    <div class="logs-corpo">
      <p class="nota" id="logs-estado">Quem acessou o sistema, quando, de onde e com qual aparelho.</p>
      <div class="linha-botoes">
        <input class="campo" id="logs-chave" type="password" autocomplete="off" placeholder="Chave de leitura dos logs" aria-label="Chave de leitura dos logs">
        <button class="botao" id="logs-ver">Ver logs</button>
      </div>
      <div class="logs-tabela"><table id="logs-tabela" hidden>
        <thead><tr><th>Data e hora</th><th>Usuário</th><th>Evento</th><th>Localização</th><th>Aparelho</th><th>Internet</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
  </section>
</main>
<div id="avisos"></div>
<script type="module" src="js/logs.js"></script>
</body>
</html>
